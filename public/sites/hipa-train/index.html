<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIPA: Claude, ChatGPT and AI Tools for the Education Department</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F9;--surface:#FFFFFF;--surface2:#ECEFF5;--ink:#0E1B33;--muted:#56627A;--line:#D8DEE8;--navy:#0E1F3D;--navy2:#16305C;--gold:#9C7414;--goldfill:#E3B341;--goldsoft:#F7EDD3;--green:#226B49;--greensoft:#DDF0E6;--red:#A3302A;--redsoft:#F7E1DF;--onnavy:#F3F5FA;--onnavymuted:#AEB9CF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1426;--surface:#111E38;--surface2:#0D182D;--ink:#E8ECF4;--muted:#9AA6BE;--line:#23334F;--navy:#081429;--gold:#E8C15A;--goldsoft:#2C2612;--green:#5FC593;--greensoft:#12301F;--red:#F08A80;--redsoft:#3A1714;--onnavymuted:#9AA6BE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1426;--surface:#111E38;--surface2:#0D182D;--ink:#E8ECF4;--muted:#9AA6BE;--line:#23334F;--navy:#081429;--gold:#E8C15A;--goldsoft:#2C2612;--green:#5FC593;--greensoft:#12301F;--red:#F08A80;--redsoft:#3A1714;--onnavymuted:#9AA6BE;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--navy)}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.005em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--goldfill);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:var(--onnavy);display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:3px solid var(--goldfill)}
.wordmark{display:flex;align-items:center;gap:10px;flex:none}
.wordmark img{width:34px;height:34px;border-radius:6px;background:#fff}
.wordmark div{display:flex;flex-direction:column;line-height:1.05}
.wordmark b{font-weight:600;letter-spacing:.14em;font-size:15px;color:var(--goldfill)}
.wordmark span{font-size:12px;color:var(--onnavymuted)}
.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.tab{background:none;border:none;color:var(--onnavymuted);padding:8px 12px;border-radius:8px;white-space:nowrap;font-weight:500;font-size:14.5px}
.tab:hover{color:var(--onnavy);background:#18305A}
.tab[aria-current="page"]{color:var(--navy);background:var(--goldfill)}
.tools{display:flex;gap:6px;flex:none}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:#14284B;border:1px solid #2B4170;color:var(--onnavy);border-radius:8px;padding:7px 11px;font-size:14px;font-weight:500}
.tbtn:hover{border-color:var(--goldfill)}
.tbtn.present{background:var(--goldfill);color:var(--navy);border-color:var(--goldfill)}
.main{padding:30px clamp(16px,4vw,56px) 80px}
.wrap{max-width:1000px;margin:0 auto}
.hero{background:var(--navy);color:var(--onnavy);border-radius:18px;padding:clamp(24px,5vw,52px)}
.hero .k{color:var(--goldfill);font-weight:600;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
.hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.08;margin-top:10px;max-width:22ch}
.hero p{color:var(--onnavymuted);margin:14px 0 0;max-width:62ch;font-size:17px}
.who{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:14.5px}
.who span{border-left:3px solid var(--goldfill);padding-left:10px}
h2.sec{font-size:24px;margin:38px 0 6px}
.lede{color:var(--muted);margin:0 0 18px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:17px;margin-bottom:6px}
.card p{margin:0;color:var(--muted);font-size:15px}
.card .n{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.06em}
.tl{display:flex;height:42px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:8px 0 6px}
.tl div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;padding:0 4px}
.tlk{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.seg{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.seghead{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;width:100%;text-align:left;background:none;border:none;color:var(--ink)}
.seghead .t{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600;min-width:118px;font-size:14.5px;padding-top:2px}
.seghead h3{font-size:18px}
.seghead .m{color:var(--muted);font-size:14px;margin-top:2px}
.seghead .chev{margin-left:auto;color:var(--muted);transition:transform .2s;flex:none}
.seg.open .chev{transform:rotate(90deg)}
.segbody{display:none;padding:0 18px 18px 152px}
.seg.open .segbody{display:block}
.segbody ul{margin:6px 0 10px;padding-left:20px}
.segbody li{margin:4px 0}
.say{background:var(--goldsoft);border-left:4px solid var(--goldfill);padding:12px 14px;border-radius:0 10px 10px 0;margin:10px 0;font-size:15px}
.say b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-right:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
:root[data-theme="dark"] .chip.on{background:var(--goldfill);color:#0E1F3D;border-color:var(--goldfill)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.ptop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ptop h3{font-size:17px;flex:1;min-width:200px}
.copy{background:var(--navy);color:var(--onnavy);border:none;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500}
:root[data-theme="dark"] .copy{background:var(--goldfill);color:#0E1F3D}
.copy.ok{background:var(--green);color:#fff}
pre.pr{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;margin:8px 0 0;overflow-x:auto}
.why{color:var(--muted);font-size:14.5px;margin:8px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.do{border-top:4px solid var(--green)}.dont{border-top:4px solid var(--red)}
.do h3{color:var(--green)}.dont h3{color:var(--red)}
.list{margin:6px 0 0;padding-left:20px}.list li{margin:6px 0}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:none}
.check input{width:20px;height:20px;margin-top:2px;accent-color:#226B49;flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.check small{display:block;color:var(--muted);font-size:13px}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.prog div{height:100%;background:var(--green);transition:width .3s}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--navy);color:var(--onnavy);font-weight:600;font-size:14px}
.src{font-size:13.5px;color:var(--muted);margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
.stage{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.stage[hidden]{display:none}
.stagebar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 10px;background:var(--navy);color:var(--onnavy);border-bottom:3px solid var(--goldfill)}
.stagebar .where{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--onnavymuted)}
.stagebar .cnt{font-variant-numeric:tabular-nums;font-size:14px}
.slide{flex:1;overflow:auto;padding:clamp(24px,5vh,60px) clamp(20px,6vw,96px)}
.slide .inner{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.slide .k{color:var(--gold);font-weight:600;font-size:18px;letter-spacing:.04em}
.slide h1{font-size:clamp(36px,5.4vw,68px);line-height:1.06;margin:10px 0 0}
.slide h2{font-size:clamp(30px,4vw,50px);line-height:1.1;margin:8px 0 18px}
.slide p.big{font-size:clamp(20px,2.4vw,30px);color:var(--muted);max-width:40ch;margin:18px 0 0}
.slide ul{font-size:clamp(18px,2.1vw,26px);padding-left:28px;margin:0}
.slide li{margin:10px 0}
.slide .sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.slide .sgrid .card{font-size:17px}.slide .sgrid .card h3{font-size:21px}
.slide pre.pr{font-size:clamp(14px,1.5vw,18px)}
.slide .quote{font-size:clamp(28px,3.4vw,46px);line-height:1.25;max-width:26ch;border-left:6px solid var(--goldfill);padding-left:24px}
.stagenotes{background:var(--surface2);border-top:1px solid var(--line);padding:14px 24px calc(env(safe-area-inset-bottom,0px) + 14px);white-space:pre-wrap;font-size:15px;max-height:28vh;overflow:auto}
.stagenotes[hidden]{display:none}
/* Venn */
.venn{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start;margin:14px 0}
.vhint{color:var(--muted);font-size:14px;margin:10px 0 0}
.vstage{position:relative}
.vstage svg{display:block;width:100%;height:auto}
.vuni{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:fill .5s}
.vuni.dim{fill:var(--surface2)}
.vulab{fill:var(--muted);font-size:14px;font-weight:500}
.dt{fill:var(--gold);opacity:.55;transition:opacity .5s ease,fill .5s ease}
.dt.out{fill:var(--muted);opacity:.14}
.dt.lit{fill:#0E1F3D;opacity:1}
:root[data-theme="dark"] .dt.lit{fill:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dt.lit{fill:#fff}}
.vc{fill:var(--c);fill-opacity:.1;stroke:var(--c);stroke-width:2.5;opacity:0;transform:scale(.55);transform-box:fill-box;transform-origin:center;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.25,1.15)}
.vset.on .vc{opacity:1;transform:none}
.vlab{fill:var(--c);font-weight:700;font-size:17px;opacity:0;transition:opacity .5s ease .15s;paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.vset.on .vlab{opacity:1}
.vint{opacity:.55}
.vint.all{opacity:1;animation:vpulse 2.4s ease-in-out infinite}
@keyframes vpulse{50%{opacity:.7}}
.vcenter{opacity:0;transition:opacity .5s ease .2s}
.vcenter.on{opacity:1}
.vcenter circle{fill:#fff;stroke:#0E1F3D;stroke-width:2}
.vcenter text{fill:var(--ink);font-weight:700;font-size:15px;paint-order:stroke;stroke:var(--surface);stroke-width:5px}
.vcount{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;align-items:flex-end;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.vnum{font-size:28px;line-height:1;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.vcap{font-size:12px;color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vtog{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 13px;border-radius:12px;transition:border-color .25s,background .25s,transform .2s}
.vtog:hover{transform:translateX(3px)}
.vtog.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.vdot{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--c);margin-top:3px;transition:background .25s,box-shadow .25s}
.vtog.on .vdot{background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.vk{display:block;font-weight:600;font-size:15px;color:var(--c)}
.vq{display:block;font-size:13.5px;font-weight:500;margin-top:1px}
.vex{display:block;font-size:13px;color:var(--muted);margin-top:2px;max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .35s ease}
.vtog.on .vex{max-height:60px;opacity:1}
.wbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mini{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500}
.mini.prim{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
:root[data-theme="dark"] .mini.prim{background:var(--goldfill);color:#0E1F3D;border-color:var(--goldfill)}
.vmsg{margin:14px 0 0;font-size:14.5px;line-height:1.45;padding:12px 14px;border-radius:10px;background:var(--goldsoft);border:1px solid var(--line)}
.vbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin:6px 0 20px}
.vbox h3{font-size:18px}
.slide .venn{margin:0}.slide .vk{font-size:17px}.slide .vq{font-size:15px}.slide .vex{font-size:14.5px}
@media (max-width:900px){.venn{grid-template-columns:1fr}}
.layout{display:flex;min-height:calc(100% - 60px)}
.side{width:270px;flex:none;border-right:1px solid var(--line);background:var(--surface2);padding:18px 12px 28px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow-y:auto}
.side[hidden]{display:none}
.side h4{margin:4px 10px 2px;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.side h4.grp{margin-top:16px}
.side .chap{margin:0 10px 8px;font-size:20px;font-weight:600}
.sitem{display:flex;gap:10px;width:100%;text-align:left;background:none;border:none;border-left:3px solid transparent;color:var(--ink);padding:8px 10px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.35}
.sitem:hover{background:var(--surface)}
.sitem.cur{background:var(--surface);border-left-color:var(--goldfill);font-weight:600}
.sitem .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:40px;padding-top:1px}
.main{flex:1;min-width:0}
.linkbtn{background:none;border:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--goldfill);text-underline-offset:3px}
.seghero{background:var(--navy);color:var(--onnavy);border-radius:18px;padding:clamp(22px,4vw,40px)}
.seghero .k{color:var(--goldfill);font-weight:600;font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.seghero h1{font-size:clamp(28px,4vw,44px);margin-top:8px}
.seghero p{color:var(--onnavymuted);margin:8px 0 0;font-size:17px}
.pager{display:flex;justify-content:space-between;margin-top:24px}
.tool{display:flex;flex-direction:column}
.tlink{display:inline-block;margin-top:12px;color:var(--gold);font-weight:600;font-size:14.5px;text-decoration:none}
.tlink:hover{text-decoration:underline}
.thgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.thlogo{width:130px;height:130px;border-radius:24px;background:#fff}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fphoto{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--navy2)}
.fphoto img{width:100%;height:100%;object-fit:cover;display:block}
.fover{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 14px;background:linear-gradient(180deg,transparent,rgba(8,20,41,.92))}
.fover h3{font-size:21px;color:#fff}
.fover .frole{color:#F3D98B;font-size:13.5px;margin:4px 0 0}
.ftag{position:absolute;top:14px;left:14px;color:#0E1F3D;background:#E3B341;font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:99px}
.fbody{padding:12px 18px 18px}
.fbody .list li{font-size:14.5px}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.acard{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.acard img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--goldfill)}
.acard h3{font-size:16px}
.alines{margin:4px 0 0;padding-left:18px}
.alines li{font-size:14px;color:var(--muted);line-height:1.45}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.rcard{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.rcard svg{color:var(--gold);flex:none;margin-top:1px}
.contact{margin-top:34px;background:var(--navy);color:var(--onnavy);border-radius:14px;padding:18px 22px;border-bottom:3px solid var(--goldfill)}
.contact b{display:block;color:var(--goldfill)}
.contact span{color:var(--onnavymuted);font-size:14.5px}
@media (max-width:860px){.layout{flex-direction:column}.side{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 12px}.side h4,.side .chap{display:none}.sitem{flex:none;width:auto;border-left:none;border-bottom:3px solid transparent;border-radius:8px;white-space:nowrap}.sitem.cur{border-bottom-color:var(--goldfill)}.thgrid{grid-template-columns:1fr}.thlogo{width:90px;height:90px}}
.brandlink{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.logomark{width:40px;height:40px;border-radius:10px;display:block;background:#fff;box-shadow:0 0 0 1px #2B4170}
.wordmark{display:flex;flex-direction:column;line-height:1.05}
.insta{text-decoration:none;background:transparent;border:1px solid rgba(255,255,255,.55);color:#FFFFFF;position:relative;overflow:hidden}
.insta::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#F58529,#DD2A7B,#8134AF,#515BD4)}
.insta:hover{background:#FFFFFF;color:var(--navy);border-color:#FFFFFF}
#dlslides{background:var(--goldfill);color:#0E1F3D;border-color:var(--goldfill);font-weight:600}
#dlslides:hover{filter:brightness(1.06)}
.pollc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.pcount{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.popts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.popt{text-align:left;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:15.5px;transition:border-color .2s,transform .15s}
.popt:hover{border-color:var(--goldfill);transform:translateX(3px)}
.popt:disabled{opacity:.6}
.pres{position:relative;display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:hidden;font-size:15.5px;background:var(--surface2)}
.pres i{position:absolute;left:0;top:0;bottom:0;background:var(--goldsoft);transition:width .6s ease}

{cat:"Prompting",title:"One line versus structured: the HIPA report",p:"ONE LINE:\nSummarise this report.\n\nSTRUCTURED (five elements):\nRole: You are a briefing officer in the Directorate of School Education, Haryana.\nContext: The attached HIPA Annual Activity Report 2024-25 is about 70 pages. My Director has five minutes and wants to know what HIPA did this year and what it means for our department.\nTask: Summarise the report and pull out everything relevant to the School Education Department.\nFormat: Give it as a one-page Word document: five key numbers in a table, a short section ‘For our department’, and three action points. Give the page number for each point.\nConstraints: Use only what is in the report. Mark anything that is your own suggestion, and list anything I should verify.",why:"Upload the report and run both. Compare which answer you could put up to your Director."},
{cat:"Drafting",title:"Office order for a training programme (Hindi)",p:"आप जिला शिक्षा अधिकारी कार्यालय में एक अधिकारी हैं।\nएक कार्यालय आदेश तैयार करें जिसमें [विद्यालयों की सूची] के प्रवक्ताओं को [तिथि] को [स्थान] पर होने वाले प्रशिक्षण कार्यक्रम में भाग लेने के निर्देश हों।\nशामिल करें: आदेश क्रमांक और दिनांक के लिए स्थान, प्रशिक्षण का विषय, समय, रिपोर्टिंग अधिकारी, और प्रतिलिपि किसे भेजी जाए।\nभाषा औपचारिक रखें।",why:"Shows the tools handle formal Hindi and standard order formats."},
{cat:"Drafting",title:"Reply to a public grievance (CM Window)",p:"You are an officer in the District Education Office.\nDraft a reply to the grievance below received on CM Window.\nContext: The complainant says the transfer certificate of his daughter has not been issued for three weeks. The school has now issued it on [date].\nFormat: A short, polite reply in Hindi: acknowledgement, action taken with date, and contact for further help.\nConstraints: Under 150 words. Do not blame any individual by name. Do not promise anything not already done.\n\n[paste grievance text with dummy names]",why:"Useful for keeping replies polite, factual and free of over-promising."},

{cat:"Documents",title:"Compare two versions of a circular",p:"Below are two versions of the same circular, the old one and the revised one.\nList every change in a table: Point, Old version, Revised version, What it means for schools.\nThen give a three-line summary for the principals’ WhatsApp group.\n\n[paste both texts]",why:"Works best with both files uploaded to Claude or NotebookLM."},
