  }
  function stepStage(dir){ var n = ui.stageIdx + dir; if (n < 0 || n >= deck.length) return; stopPlay(); ui.stageIdx = n; $("slide").scrollTop = 0; renderStage(); }
  function toggleFull(){ try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){ toast("Full screen is not available here"); }); else document.exitFullscreen(); } catch(e) { toast("Full screen is not available here"); } }

  /* ---------- Timers ---------- */
  var playT = null, clockT = null;
  function stopPlay(){ if (playT) { clearInterval(playT); playT = null; } if (ui.playing) { ui.playing = null; } }
  function playEras(){
    if (ui.playing === "era") { stopPlay(); rerender(); return; }
    ui.playing = "era"; if (ui.era >= D.eras.length - 1) ui.era = 0; rerender();
    playT = setInterval(function(){ if (ui.era >= D.eras.length - 1) { stopPlay(); rerender(); return; } ui.era++; var keep = ui.playing; rerender(); ui.playing = keep; }, 2600);
  }
  function tick(){
    if (!ui.news.run) return;
    if (ui.news.left > 0) ui.news.left--;
    var el = $("clock"); if (el) { el.textContent = fmtTime(ui.news.left); el.parentNode.classList.toggle("warn", ui.news.left <= 120); }
    if (ui.news.left === 0) { ui.news.run = false; toast("Time is up for this update"); rerender(); }
  }
  clockT = setInterval(tick, 1000);

  /* ---------- Events ---------- */
  function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.classList.remove("show"); }, 1800); }
  function copyText(txt){
    function fallback(){ var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Prompt copied"); } catch(e) { toast("Copy failed; select the text instead"); } ta.remove(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast("Prompt copied"); }, fallback); else fallback();
  }
  function act(t){
    var a = t.dataset.act, sid = t.dataset.sid, i = t.dataset.i != null ? +t.dataset.i : null, s;
    switch (a) {
      case "era": stopPlay(); ui.era = i; break;
      case "eraplay": playEras(); return;
      case "flow": ui.flow[sid] = i; break;
      case "flowstep": ui.flow[sid] = Math.max(0, (ui.flow[sid] || 0) + +t.dataset.d); break;
      case "flip": ui.flip[t.dataset.key] = !ui.flip[t.dataset.key]; break;
      case "flipall": ui.flip[sid + "*"] = !ui.flip[sid + "*"]; break;
      case "cmp": ui.flip[sid + "cmp"] = t.dataset.v; break;
      case "agentrun": s = ui.agent[sid] || { step: -1 }; s.step++; ui.agent[sid] = s; break;
      case "agentreset": ui.agent[sid] = { step: -1, verdict: null }; break;
      case "verdict": ui.agent[sid].verdict = t.dataset.v; break;
      case "build": ui.built[sid] = ui.built[sid] || {}; ui.built[sid][t.dataset.k] = !ui.built[sid][t.dataset.k]; break;
      case "copybuilt": s = findSession(sid); copyText(s.visual.items.filter(function(it){ return (ui.built[sid] || {})[it.k]; }).map(function(it){ return it.k + ": " + it.v; }).join("\n")); return;
      case "spot": ui.spot[sid] = ui.spot[sid] || {}; ui.spot[sid][i] = 1; break;
      case "spotreset": ui.spot[sid] = {}; break;
      case "sugg": ui.q = t.dataset.v; break;
      case "face": ui.flip[sid + "face"] = t.dataset.v; break;
      case "lang": ui.tpl.lang = t.dataset.v; break;
      case "lock": ui.tpl.lock = !ui.tpl.lock; break;
      case "fmt": ui.fmt = t.dataset.v; break;
      case "shot": ui.shot = i; break;
      case "sec": ui.secs[ui.shot] = Math.max(3, ui.secs[ui.shot] + +t.dataset.d); break;
      case "bt": ui.bt = !ui.bt; break;
      case "newsnext": ui.news.i++; ui.news.left = 600; ui.news.run = true; break;
      case "newspause": ui.news.run = !ui.news.run; break;
      case "newsreset": ui.news = { i: -1, left: 600, run: false }; break;
      case "vote": s = findSession(sid); ui.votes[sid] = ui.votes[sid] || s.pause.options.map(function(){ return 0; }); ui.votes[sid][i]++; break;
      case "reveal": ui.reveal[sid] = !ui.reveal[sid]; break;
      case "votereset": ui.votes[sid] = null; ui.reveal[sid] = false; break;
      case "copy": s = findSession(sid); copyText(s.exercise.prompt); return;
      case "done": if (store.done[sid]) delete store.done[sid]; else store.done[sid] = 1; save(); toast(store.done[sid] ? "Marked as completed" : "Marked as not completed"); break;
      case "agentsel": ui.agentSel = i; break;
      case "pts": store.points[t.dataset.g] = Math.max(0, store.points[t.dataset.g] + +t.dataset.d); save(); break;
      case "resetall": if (!confirm("Reset all points, scores and race times?")) return; store.points = { A: 0, B: 0, C: 0 }; store.scores = {}; store.race = {}; save(); toast("Scoreboard reset"); break;
      case "job": ui.toolJob = t.dataset.v; break;
      case "refgrp": ui.refGrp = t.dataset.v; break;
      case "ask": ui.ask = t.dataset.v; break;
      case "slides": openStage(); return;
      default: return;
    }
    rerender();
  }
  document.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-go],[data-act]"); if (!t || t.disabled) return;
    if (t.dataset.go) { go(t.dataset.go); return; }
    act(t);
  });
  document.addEventListener("keydown", function(ev){
    var t = ev.target;
    if (t && t.getAttribute && t.getAttribute("role") === "button" && t.dataset.act && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); act(t); return; }
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (staged()) {
      if (ev.key === "ArrowRight" || ev.key === "PageDown") { ev.preventDefault(); stepStage(1); }
      else if (ev.key === "ArrowLeft" || ev.key === "PageUp") { ev.preventDefault(); stepStage(-1); }
      else if (ev.key === "Escape") closeStage();
      else if (ev.key === "n" || ev.key === "N") { ui.stageNotes = !ui.stageNotes; renderStage(); }
      else if (ev.key === "f" || ev.key === "F") toggleFull();
      return;
    }
    if (ev.key === "p" || ev.key === "P") openStage();
    else if (ev.key === "f" || ev.key === "F") toggleFull();
    else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
      var s = findSession(ui.view), dir = ev.key === "ArrowRight" ? 1 : -1;
      if (s) { var n = sessions[sessions.indexOf(s) + dir]; if (n) go(n.id); }
      else { var d = currentDay(); if (d && dir === 1) go(d.sessions[0].id); else if (ui.view === "story" && dir === 1) go("day1"); }
    }
  });
  document.addEventListener("input", function(ev){
    var t = ev.target, k = t.dataset && t.dataset.inp; if (!k) return;
    if (k === "era") { stopPlay(); ui.era = +t.value; rerender(); }
    else if (k === "q") { ui.q = t.value; var el = $("arch"); if (el) el.innerHTML = archiveResults(); }
    else if (k === "ask") { ui.ask = t.value; var ar = $("askres"); if (ar) ar.innerHTML = askResults(); }
    else if (k === "plq") { ui.plq = t.value; $("plib").innerHTML = plibHtml(); }
    else if (k === "head") { ui.tpl.head = t.value; $("tplprev").innerHTML = tplPreview(); }
    else if (k === "occ") { ui.tpl.occ = +t.value; $("tplprev").innerHTML = tplPreview(); }
    else if (k === "pos") { ui.flip[t.dataset.sid + "pos"] = +t.value; t.parentNode.style.setProperty("--p", t.value + "%"); }
    else if (k === "score" || k === "race") {
      var bag = k === "score" ? store.scores : store.race, g = t.dataset.g; bag[g] = bag[g] || {}; bag[g][t.dataset.f] = t.value; save();
      ["scorechart-d1", "scorechart-d3", "scorechart-d1x"].forEach(function(id){ var el = $(id); if (el) el.innerHTML = scoreChart(); });
      var rc = $("racechart"); if (rc) rc.innerHTML = raceChart();
    }
  });
  $("menu").onclick = function(){ $("side").classList.toggle("open"); };
  $("themeBtn").onclick = function(){
    var r = document.documentElement, dark = r.getAttribute("data-theme") ? r.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var nt = dark ? "light" : "dark"; r.setAttribute("data-theme", nt); try { localStorage.setItem("ai4pr-theme", nt); } catch(e) {}
  };
  $("presentBtn").onclick = openStage;
  $("sPrev").onclick = function(){ stepStage(-1); };
  $("sNext").onclick = function(){ stepStage(1); };
  $("sNotes").onclick = function(){ ui.stageNotes = !ui.stageNotes; renderStage(); };
  $("sFull").onclick = toggleFull;
  $("sExit").onclick = closeStage;
  window.addEventListener("hashchange", function(){ var h = (location.hash || "").slice(1); if (h && h !== ui.view && (findSession(h) || /^(day[123]|agents|scoreboard|toolkit|story|references|team)$/.test(h))) go(h); });
  var h0 = (location.hash || "").slice(1);
  if (h0 && (findSession(h0) || /^(day[123]|agents|scoreboard|toolkit|story|references|team)$/.test(h0))) ui.view = h0;
  render(true);
})();

<script>
/* ---------- Slide downloads (PowerPoint), by session and by day ---------- */
(function(){
  var D = DATA, PPT_URL = "https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js";
  var C = { bg: "000000", card: "121214", line: "26262B", ink: "F4F4F5", muted: "8B8B92", red: "FF5468", green: "34D399", gold: "E3B341", white: "FFFFFF" };
  var DAYCOL = { 1: C.red, 2: C.green, 3: C.gold };
  var F = "Arial";

  var all = [];
  D.days.forEach(function(d){ d.sessions.forEach(function(s, i){ all.push({ d: d, s: s, i: i, code: "D" + d.n + "." + (i + 1) }); }); });
  var sel = {};
  function toast(m){ var t = document.getElementById("toast"); if (!t) return; t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.classList.remove("show"); }, 2400); }
  function esc(x){ return String(x == null ? "" : x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    return libP;
  }
  function logo(){ var el = document.querySelector(".logomark"); return el ? el.getAttribute("src") : null; }

  /* slide chrome */
  function base(p, dn, label, notes){
    var sl = p.addSlide({ masterName: "AI4PR" });
    if (label) sl.addText(label, { x: 6.3, y: 0.42, w: 6.6, h: 0.3, fontFace: F, fontSize: 10.5, color: C.muted, align: "right", margin: 0 });

  function heading(sl, txt, dn, y){

    sl.addText(txt, { x: 0.6, y: (y || 1.25) + 0.15, w: 12.1, h: 0.8, fontFace: F, fontSize: 28, bold: true, color: C.ink, margin: 0, valign: "top" });
  }
  function card(sl, x, y, w, h, k, v, col){
    sl.addShape("roundRect", { x: x, y: y, w: w, h: h, fill: { color: C.card }, line: { color: C.line, width: 1 }, rectRadius: 0.12 });
    sl.addShape("rect", { x: x + 0.2, y: y + 0.2, w: 0.36, h: 0.05, fill: { color: col || C.red }, line: { color: col || C.red } });
    sl.addText(k, { x: x + 0.2, y: y + 0.32, w: w - 0.4, h: 0.45, fontFace: F, fontSize: 15, bold: true, color: C.ink, margin: 0, valign: "top" });
    if (v) sl.addText(v, { x: x + 0.2, y: y + 0.8, w: w - 0.4, h: h - 0.95, fontFace: F, fontSize: 12.5, color: C.muted, margin: 0, valign: "top" });
  }
  function cards(sl, items, dn){
    var n = items.length, cols = n <= 3 ? n : (n === 4 ? 2 : 3), rows = Math.ceil(n / cols);
    var W = 12.1, gap = 0.25, cw = (W - gap * (cols - 1)) / cols, top = 2.35, H = 4.4, ch = Math.min(2.6, (H - gap * (rows - 1)) / rows);
    var cl = [C.red, C.gold, C.green];
    items.forEach(function(it, i){ var c = i % cols, r = Math.floor(i / cols); card(sl, 0.6 + c * (cw + gap), top + r * (ch + gap), cw, ch, it.k, it.v, cl[i % 3]); });
  }
  function bullets(sl, arr, opts){
    opts = opts || {};
    sl.addText(arr.map(function(t){ return { text: t, options: { bullet: opts.num ? { type: "number" } : { code: "25A0" }, paraSpaceAfter: 8 } }; }),
      { x: opts.x || 0.6, y: opts.y || 2.35, w: opts.w || 12.1, h: opts.h || 4.4, fontFace: F, fontSize: opts.fs || 17, color: C.ink, valign: "top", margin: 0 });
  }

  function visualSlide(p, s, dn, label){
    var v = s.visual; if (!v) return;
    var sl = base(p, dn, label, s.notes);
    heading(sl, s.title, dn);
    var t = v.type;
    if (t === "flow") cards(sl, v.steps.map(function(x, i){ return { k: (i + 1) + ". " + x.label, v: x.detail }; }), dn);
    else if (t === "grid") cards(sl, v.items, dn);
    else if (t === "builder") cards(sl, v.items, dn);
    else if (t === "compare") cards(sl, [{ k: v.left.title, v: v.left.items.join("\n") }, { k: v.right.title, v: v.right.items.join("\n") }], dn);
    else if (t === "agent") cards(sl, [{ k: "Input", v: v.input }, { k: "Steps", v: v.steps.map(function(x, i){ return (i + 1) + ". " + x; }).join("\n") }, { k: "Human checkpoint", v: v.check }, { k: "Output", v: v.output }], dn);
    else if (t === "eras") {
      var list = D.eras.slice(); if (v.seventh) list.push({ years: "November 2026", name: "The NDDB PR team", lesson: "Making is easy now. Judgement is the job." });
      var rows = [[{ text: "Years", options: { bold: true, color: C.muted } }, { text: "Era", options: { bold: true, color: C.muted } }, { text: "Lesson", options: { bold: true, color: C.muted } }]];
      list.forEach(function(e){ rows.push([e.years, e.name, e.lesson]); });
      sl.addTable(rows, { x: 0.6, y: 2.3, w: 12.1, colW: [2.4, 3.6, 6.1], fontFace: F, fontSize: 13, color: C.ink, fill: { color: C.card }, border: { type: "solid", color: C.line, pt: 1 }, rowH: 0.5 });
    }
    else if (t === "spot" || t === "fivef") cards(sl, D.fivef, dn);
    else if (t === "search") cards(sl, D.archive.slice(0, 6).map(function(a){ return { k: a.cap, v: "Tags: " + a.tags }; }), dn);
    else if (t === "faces") cards(sl, [{ k: "Upscaled offline", v: "Sharper, and still the same person. Passes the Faces check." }, { k: "Generative enhance", v: "Can change age, features and expression. Fails the Faces check: do not publish." }], dn);
    else if (t === "template") cards(sl, [{ k: "Stays fixed", v: "Logo, colours, fonts, layout grid" }, { k: "Changes each time", v: "Occasion, headline, photo, language" }, { k: "Occasions", v: D.occasions.join("\n") }], dn);
    else if (t === "formats") cards(sl, D.formats.map(function(f){ return { k: f.name, v: "Aspect ratio " + f.w + ":" + f.h }; }), dn);
    else if (t === "storyboard") cards(sl, D.shots.map(function(x){ return { k: x.label + ", " + x.sec + " s", v: x.vo }; }), dn);
    else if (t === "backtrans") cards(sl, [{ k: "Original", v: D.bt.en }, { k: "Hindi (AI)", v: D.bt.hi }, { k: "Back to English", v: D.bt.back.join(" ") + "\nFix: " + D.bt.fix }], dn);
    else if (t === "newsroom") bullets(sl, D.updates, { fs: 16 });
    else if (t === "scores") cards(sl, [{ k: "Same three items", v: "Remade in the same 30 minutes as Day 1" }, { k: "Same rubric", v: "Scored 1 to 5 on clarity, voice, visuals, language and errors" }, { k: "Side by side", v: "Day 1 and Day 3 versions compared" }], dn);
  }
  function sessionSlides(p, it){
    var s = it.s, dn = it.d.n, label = it.code + "  " + s.title;
    var sl = base(p, dn, label, s.notes);
    sl.addShape("rect", { x: 0.6, y: 2.35, w: 0.9, h: 0.09, fill: { color: DAYCOL[dn] }, line: { color: DAYCOL[dn] } });
    sl.addText(it.code + "   " + s.time + "   " + s.min + " min", { x: 0.6, y: 2.6, w: 12, h: 0.4, fontFace: F, fontSize: 15, bold: true, color: DAYCOL[dn], margin: 0 });
    sl.addText(s.title, { x: 0.6, y: 3.05, w: 12, h: 1.6, fontFace: F, fontSize: 40, bold: true, color: C.ink, margin: 0, valign: "top", fit: "shrink" });
    sl.addText(s.lede, { x: 0.6, y: 4.8, w: 10.5, h: 1.2, fontFace: F, fontSize: 19, color: C.muted, margin: 0, valign: "top" });
    visualSlide(p, s, dn, label);
    if (s.pause) {
      var q = base(p, dn, label, s.notes);
      heading(q, "Quick question", dn);
      q.addText(s.pause.q, { x: 0.6, y: 2.3, w: 12.1, h: 1.1, fontFace: F, fontSize: 21, color: C.ink, margin: 0, valign: "top" });
      bullets(q, s.pause.options, { y: 3.55, h: 3.2, fs: 18, num: true });
      var a = base(p, dn, label, s.notes);
      heading(a, s.pause.open ? "Talking point" : "Answer", dn);
      if (!s.pause.open && s.pause.answer != null) a.addText(s.pause.options[s.pause.answer], { x: 0.6, y: 2.35, w: 12.1, h: 0.8, fontFace: F, fontSize: 24, bold: true, color: C.green, margin: 0 });
      a.addText(s.pause.why, { x: 0.6, y: 3.3, w: 12.1, h: 3, fontFace: F, fontSize: 18, color: C.ink, margin: 0, valign: "top" });
    }
    if (s.exercise) {
      var e = base(p, dn, label, s.notes);
      heading(e, "Exercise: " + s.exercise.title, dn);
      bullets(e, s.exercise.steps, { num: true, fs: 19 });
      if (s.exercise.prompt) {
        var pr = base(p, dn, label, s.notes), L = s.exercise.prompt.length;
        heading(pr, "Prompt to copy", dn);
        pr.addShape("roundRect", { x: 0.6, y: 2.3, w: 12.1, h: 4.5, fill: { color: C.card }, line: { color: C.line, width: 1 }, rectRadius: 0.1 });
        pr.addText(s.exercise.prompt, { x: 0.85, y: 2.45, w: 11.6, h: 4.2, fontFace: "Courier New", fontSize: L > 900 ? 10 : L > 550 ? 12 : 14.5, color: C.ink, margin: 0, valign: "top" });
      }
    }
    var lv = base(p, dn, label, s.notes);
    heading(lv, "You leave with", dn);
    lv.addText(s.leave, { x: 0.6, y: 2.4, w: 12.1, h: 2.2, fontFace: F, fontSize: 26, color: C.ink, margin: 0, valign: "top" });
  }
  function cover(p, title, sub, meta, dn){
    var sl = base(p, dn, "", "");
    sl.addText("Prepared for the National Dairy Development Board", { x: 0.6, y: 1.9, w: 12, h: 0.4, fontFace: F, fontSize: 14, color: C.green, bold: true, margin: 0 });
    sl.addText(title, { x: 0.6, y: 2.45, w: 12, h: 1.9, fontFace: F, fontSize: 46, bold: true, color: C.ink, margin: 0, valign: "top", fit: "shrink" });
    if (sub) sl.addText(sub, { x: 0.6, y: 4.45, w: 10.8, h: 1.1, fontFace: F, fontSize: 19, color: C.muted, margin: 0, valign: "top" });
    sl.addText(meta || (D.when + "\n" + D.facilitators), { x: 0.6, y: 5.75, w: 11, h: 0.8, fontFace: F, fontSize: 13, color: C.ink, margin: 0, valign: "top" });
  }
  function dayDeck(p, d){
    cover(p, "Day " + d.n + ": " + d.chapter, d.theme + ". " + d.intro, null, d.n);
    var ag = base(p, d.n, "Day " + d.n + " agenda", "");
    heading(ag, "Day " + d.n + " agenda", d.n);
    var rows = d.sessions.map(function(s, i){ return [{ text: s.time, options: { color: C.muted } }, { text: "D" + d.n + "." + (i + 1), options: { color: DAYCOL[d.n], bold: true } }, s.title]; });
    ag.addTable(rows, { x: 0.6, y: 2.25, w: 12.1, colW: [1.9, 1.0, 9.2], fontFace: F, fontSize: 13, color: C.ink, fill: { color: C.card }, border: { type: "solid", color: C.line, pt: 1 }, rowH: 0.4 });
    var op = base(p, d.n, "Day " + d.n, "Opening beat.");
    heading(op, "Opening", d.n);
    op.addText(d.open, { x: 0.6, y: 2.4, w: 11.5, h: 3, fontFace: F, fontSize: 26, color: C.ink, margin: 0, valign: "top" });
    all.filter(function(it){ return it.d === d; }).forEach(function(it){ sessionSlides(p, it); });
    var cl = base(p, d.n, "Day " + d.n, "Closing beat.");
    heading(cl, "Closing", d.n);
    cl.addText(d.close, { x: 0.6, y: 2.4, w: 11.5, h: 3, fontFace: F, fontSize: 26, color: C.ink, margin: 0, valign: "top" });
  }
  function newDeck(title){
    var p = new window.PptxGenJS(); p.layout = "LAYOUT_WIDE"; p.author = "Agility AI Private Limited"; p.company = "Agility AI Private Limited"; p.title = title;
    var lg = logo(), objs = [];
    if (lg) objs.push({ image: { data: lg, x: 0.45, y: 0.35, w: 0.48, h: 0.48 } });
    objs.push({ text: { text: "AGILITY AI", options: { x: 1.02, y: 0.36, w: 3, h: 0.24, fontFace: F, fontSize: 11, bold: true, color: C.ink, charSpacing: 3, margin: 0 } } });
    objs.push({ text: { text: "AI4PR for NDDB", options: { x: 1.02, y: 0.6, w: 3, h: 0.22, fontFace: F, fontSize: 9.5, color: C.muted, margin: 0 } } });
    objs.push({ rect: { x: 0, y: 7.44, w: 4.444, h: 0.06, fill: { color: C.red }, line: { color: C.red } } });
    objs.push({ rect: { x: 4.444, y: 7.44, w: 4.444, h: 0.06, fill: { color: C.white }, line: { color: C.white } } });
    objs.push({ rect: { x: 8.888, y: 7.44, w: 4.445, h: 0.06, fill: { color: C.green }, line: { color: C.green } } });
    objs.push({ text: { text: "Agility AI Private Limited  |  agilityai.co.in", options: { x: 0.45, y: 7.02, w: 6, h: 0.26, fontFace: F, fontSize: 9, color: C.muted, margin: 0 } } });
    p.defineSlideMaster({ title: "AI4PR", background: { color: C.bg }, objects: objs });
    return p;
  }
  function deliver(p, filename){
    return p.write({ outputType: "blob" }).then(function(blob){
      if (dlNs) return dlNs.save({ filename: filename, data: blob }).then(function(){ toast("Saved " + filename); }, function(e){
        var c = e && e.code; if (c === "declined") return; if (c === "rate_limited") { toast("A save is already waiting. Try again in a moment."); return; }
        toast("Download is not available in this view.");
      });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000); toast("Download started");
    });
  }
  function build(kind, arg){
    status("Building the slides…");
    return loadLib().then(function(){
      var p, fn;
      if (kind === "day") { var d = D.days[arg - 1]; p = newDeck("AI4PR Day " + d.n); dayDeck(p, d); fn = "AI4PR-Day-" + d.n + "-" + slug(d.chapter) + ".pptx"; }
      else if (kind === "alldays") { p = newDeck("AI4PR, all three days"); cover(p, D.title, "All three days: " + D.days.map(function(d){ return d.chapter; }).join(", "), null, 1); D.days.forEach(function(d){ dayDeck(p, d); }); fn = "AI4PR-All-3-Days.pptx"; }
      else if (kind === "session") { var it = all[arg]; p = newDeck("AI4PR " + it.code); sessionSlides(p, it); fn = "AI4PR-" + it.code + "-" + slug(it.s.title) + ".pptx"; }
      else { var picks = all.filter(function(it, i){ return sel[i]; }); p = newDeck("AI4PR selected sessions"); cover(p, "AI4PR: selected sessions", picks.map(function(it){ return it.code; }).join(", "), null, picks[0].d.n); picks.forEach(function(it){ sessionSlides(p, it); }); fn = "AI4PR-Selected-Sessions.pptx"; }
      return deliver(p, fn);
    }).then(function(){ status(""); }, function(){ status("The slide builder could not load. Check the internet connection and try again.", true); });
  }

  /* dialog */
  var box = null;
  function status(m, bad){ var el = box && box.querySelector(".dl-status"); if (el) { el.textContent = m; el.className = "dl-status" + (m ? " show" : "") + (bad ? " bad" : ""); } }
  function count(){ var n = Object.keys(sel).filter(function(k){ return sel[k]; }).length; box.querySelector(".dl-count").textContent = n ? n + " session" + (n > 1 ? "s" : "") + " selected" : "Tick sessions to download them together"; box.querySelector("[data-dlgo]").disabled = !n; }
  function list(){
    var h = "";
    D.days.forEach(function(d){
      var idx = all.map(function(it, i){ return it.d === d ? i : -1; }).filter(function(i){ return i >= 0; });
      var allOn = idx.every(function(i){ return sel[i]; });
      h += '<section class="dl-day" style="--dc:' + (["", "var(--red2)", "var(--green2)", "var(--goldfill)"][d.n]) + '"><div class="dl-dh"><label><input type="checkbox" data-dlday="' + d.n + '"' + (allOn ? " checked" : "") + '><span><small>Day ' + d.n + ', ' + esc(d.theme) + '</small><b>' + esc(d.chapter) + '</b></span></label><button class="pill solid" data-dldownday="' + d.n + '">Download Day ' + d.n + '</button></div><ul>';
      idx.forEach(function(i){ var it = all[i]; h += '<li><label><input type="checkbox" data-dlsess="' + i + '"' + (sel[i] ? " checked" : "") + '><span class="dl-code">' + it.code + '</span><span class="dl-t">' + esc(it.s.title) + '<small>' + esc(it.s.time) + '</small></span></label><button class="pill" data-dldownsess="' + i + '">Download</button></li>'; });
      h += '</ul></section>';
    });
    box.querySelector(".dl-list").innerHTML = h; count();
  }
  function open(){
    if (!box) {
      box = document.createElement("div"); box.className = "dl-wrap"; box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-label", "Download slides");
      box.innerHTML = '<div class="dl-card"><div class="dl-head"><div><h2>Download slides</h2><p>PowerPoint files with speaker notes, by day or by session.</p></div><button class="tbtn" data-dlclose aria-label="Close">Close</button></div><div class="dl-list"></div><div class="dl-foot"><span class="dl-count"></span><span class="dl-status" role="status"></span><div class="dl-acts"><button class="pill" data-dlall>All 3 days</button><button class="pill solid" data-dlgo>Download selected</button></div></div></div>';
      document.body.appendChild(box);
      box.addEventListener("click", function(ev){ if (ev.target === box) close(); });
    }
    list(); box.classList.add("on"); document.body.style.overflow = "hidden";
  }
  function close(){ if (box) box.classList.remove("on"); var st = document.getElementById("stage"); document.body.style.overflow = st && !st.hidden ? "hidden" : ""; }
  document.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-dl],[data-dlclose],[data-dldownday],[data-dldownsess],[data-dlgo],[data-dlall]"); if (!t || t.disabled) return;
    if (t.hasAttribute("data-dlclose")) return close();
    if (t.dataset.dl) { open(); if (/^day[123]$/.test(t.dataset.dl)) { var n = +t.dataset.dl.slice(3); build("day", n); } return; }
    if (t.dataset.dldownday) return build("day", +t.dataset.dldownday);
    if (t.dataset.dldownsess) return build("session", +t.dataset.dldownsess);
    if (t.hasAttribute("data-dlall")) return build("alldays");
    if (t.hasAttribute("data-dlgo")) return build("selected");
  });
  document.addEventListener("change", function(ev){
    var t = ev.target; if (!box || !box.contains(t)) return;
    if (t.dataset.dlsess != null) { sel[+t.dataset.dlsess] = t.checked; list(); }
    else if (t.dataset.dlday) { var n = +t.dataset.dlday; all.forEach(function(it, i){ if (it.d.n === n) sel[i] = t.checked; }); list(); }
  });
  document.addEventListener("keydown", function(ev){ if (ev.key === "Escape" && box && box.classList.contains("on")) { ev.stopPropagation(); close(); } }, true);
})();
</script>
