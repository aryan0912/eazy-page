<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI4PR: Applied AI for Communications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F9;--surface:#FFFFFF;--surface2:#ECEFF5;--ink:#0E1B33;--muted:#56627A;--line:#D8DEE8;
  --navy:#0E1F3D;--navy2:#16305C;--gold:#9C7414;--goldfill:#E3B341;--goldsoft:#F7EDD3;
  --green:#226B49;--greensoft:#DDF0E6;--red:#A3302A;--redsoft:#F7E1DF;--sepia:#9A8266;
  --onnavy:#F3F5FA;--onnavymuted:#AEB9CF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1426;--surface:#111E38;--surface2:#0D182D;--ink:#E8ECF4;--muted:#9AA6BE;--line:#23334F;
  --navy:#081429;--navy2:#16305C;--gold:#E8C15A;--goldfill:#E3B341;--goldsoft:#2C2612;
  --green:#5FC593;--greensoft:#12301F;--red:#F08A80;--redsoft:#3A1714;--sepia:#A88F73;
  --onnavy:#F3F5FA;--onnavymuted:#9AA6BE;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1426;--surface:#111E38;--surface2:#0D182D;--ink:#E8ECF4;--muted:#9AA6BE;--line:#23334F;
  --navy:#081429;--navy2:#16305C;--gold:#E8C15A;--goldfill:#E3B341;--goldsoft:#2C2612;
  --green:#5FC593;--greensoft:#12301F;--red:#F08A80;--redsoft:#3A1714;--sepia:#A88F73;
  --onnavy:#F3F5FA;--onnavymuted:#9AA6BE;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--navy)}
h1,h2,h3,.serif{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:600;letter-spacing:-.005em;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--goldfill);outline-offset:2px}
a{color:inherit}

/* Brand bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:var(--onnavy);display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:3px solid var(--goldfill)}
.wordmark{display:flex;flex-direction:column;line-height:1.05;text-decoration:none;flex:none}
.wordmark b{font-weight:600;letter-spacing:.14em;font-size:15px;color:var(--goldfill)}
.wordmark span{font-size:12px;color:var(--onnavymuted)}
.menu{display:none;background:none;border:1px solid #2B4170;color:var(--onnavy);border-radius:8px;padding:6px 9px}
.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.tab{background:none;border:none;color:var(--onnavymuted);padding:8px 12px;border-radius:8px;white-space:nowrap;font-weight:500;font-size:14.5px}
.tab:hover{color:var(--onnavy);background:#18305A}
.tab[aria-current="page"]{color:var(--navy);background:var(--goldfill)}
.tools{display:flex;gap:6px;flex:none}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:#14284B;border:1px solid #2B4170;color:var(--onnavy);border-radius:8px;padding:7px 11px;font-size:14px;font-weight:500}
.tbtn:hover{border-color:var(--goldfill)}
.tbtn.on{background:var(--goldfill);color:var(--navy);border-color:var(--goldfill)}
.tbtn.present{background:var(--goldfill);color:var(--navy);border-color:var(--goldfill)}
.ic{width:17px;height:17px;flex:none}

/* Layout */
.layout{display:flex;min-height:calc(100% - 60px)}
.side{width:280px;flex:none;border-right:1px solid var(--line);background:var(--surface2);padding:18px 12px 28px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);height:calc(100vh - 59px - env(safe-area-inset-top,0px));overflow-y:auto}
.mnav{display:none;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.side h4{margin:4px 10px 2px;font-size:13px;color:var(--muted);font-weight:600}
.side .chap{margin:0 10px 12px;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:21px;font-weight:600}
.sitem{display:flex;gap:10px;width:100%;text-align:left;background:none;border:none;border-left:3px solid transparent;color:var(--ink);padding:8px 10px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.35}
.sitem:hover{background:var(--surface)}
.sitem.cur{background:var(--surface);border-left-color:var(--goldfill);font-weight:600}
.sitem .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:84px;white-space:nowrap;padding-top:1px}
.sitem .done{margin-left:auto;color:var(--green)}
.main{flex:1;min-width:0;padding:34px clamp(18px,4vw,56px) 80px}
.wrap{max-width:980px;margin:0 auto}

/* Story hero */
.hero{background:var(--navy);color:var(--onnavy);border-radius:18px;padding:clamp(26px,5vw,56px);position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,5.4vw,62px);line-height:1.04;max-width:17ch}
.hero p{color:var(--onnavymuted);margin:16px 0 0;max-width:60ch;font-size:17px}
.hero .who{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14.5px;color:var(--onnavy)}
.hero .who span{border-left:3px solid var(--goldfill);padding-left:10px}
.thesis{margin:34px 0 8px;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:clamp(22px,2.6vw,30px);line-height:1.3;max-width:34ch}
.thesis-sub{color:var(--muted);max-width:62ch;margin:0}

/* Eras timeline */
.eras{margin-top:26px}
.rail{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;padding-top:6px}
.rail::before{content:"";position:absolute;left:6%;right:6%;top:29px;height:3px;background:linear-gradient(90deg,var(--sepia),var(--goldfill));border-radius:2px}
.era{position:relative;background:none;border:none;color:var(--ink);text-align:center;padding:0 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.era .dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--c);background:var(--c);transition:transform .2s}
.era .yr{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.era .nm{font-size:14px;font-weight:600;line-height:1.25}
.era[aria-pressed="true"] .dot{transform:scale(1.25)}
.era[aria-pressed="true"] .nm{color:var(--gold)}
.era.seventh .dot{background:var(--navy2);box-shadow:0 0 0 3px var(--goldfill)}
.eradetail{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:20px 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.eradetail h3{grid-column:1/-1;font-size:24px}
.eradetail h3 small{display:block;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
.eradetail dt{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:3px}
.eradetail dd{margin:0}
.eradetail dl{margin:0}
.eradetail .lesson{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:20px}

/* Chapters */
.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:40px}
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.chapter:hover{border-color:var(--goldfill)}
.chapter .k{font-size:13px;color:var(--muted);font-weight:600}
.chapter h3{font-size:26px}
.chapter p{margin:0;color:var(--muted);font-size:14.5px}
.chapter .beat{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink)}

/* Day view */
.dayhead .k{color:var(--gold);font-weight:600;font-size:14px}
.dayhead h1{font-size:clamp(32px,4.4vw,48px);line-height:1.08;margin-top:4px}
.dayhead p{color:var(--muted);max-width:66ch;margin:12px 0 0;font-size:16.5px}
.beatbox{margin:22px 0 6px;padding:16px 20px;border-radius:12px;background:var(--goldsoft);border-left:5px solid var(--goldfill);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:19px;line-height:1.4}
.beatbox small{display:block;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;font-weight:600;color:var(--gold);margin-bottom:4px}
.agenda{margin-top:26px;border-top:1px solid var(--line)}
.arow{display:grid;grid-template-columns:110px minmax(0,1fr) 64px 28px;gap:16px;align-items:start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:16px 6px;color:var(--ink)}
.arow:hover{background:var(--surface)}
.arow .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:3px}
.arow .ti{font-weight:600;font-size:17px}
.arow .ld{color:var(--muted);font-size:14.5px;margin-top:2px}
.arow .m{color:var(--muted);font-size:13.5px;text-align:right;padding-top:3px}
.arow .ok{color:var(--green);padding-top:3px}
.break{padding:9px 6px 9px 132px;color:var(--muted);font-size:13.5px;border-bottom:1px solid var(--line);background:var(--surface2)}

/* Session view */
.shead{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:baseline;color:var(--muted);font-size:14px}
.shead b{color:var(--gold);font-weight:600}
.stitle{font-size:clamp(30px,4vw,44px);line-height:1.1;margin:8px 0 0}
.slede{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:clamp(20px,2.2vw,25px);line-height:1.35;color:var(--ink);margin:14px 0 0;max-width:40ch;opacity:.92}
.block{margin-top:30px}
.block > h2{font-size:22px;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}

.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;counter-reset:f}
.fstep{position:relative;padding:16px 16px 16px 18px;border-left:1px solid var(--line)}
.fstep:first-child{border-left:none}
.fstep .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--goldfill);font-weight:600;font-size:13.5px;margin-bottom:10px}
.fstep b{display:block;font-size:16px}
.fstep span{color:var(--muted);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.gcell{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface2)}
.gcell b{display:block;color:var(--gold);font-size:14.5px;margin-bottom:3px}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ccol{border-radius:12px;padding:18px;border:1px solid var(--line)}
.ccol.l{background:var(--surface2)}
.ccol.r{background:var(--goldsoft);border-color:transparent}
.ccol h3{font-size:19px;margin-bottom:8px}
.ccol ul{margin:0;padding-left:18px}
.ccol li{margin:4px 0}

.agentv{display:grid;grid-template-columns:1fr auto 1.4fr auto 1fr;gap:10px;align-items:stretch}
.abox{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}
.abox small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:4px}
.abox ol{margin:0;padding-left:18px}
.abox.core{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
.abox.core small{color:var(--goldfill)}
.arrow{align-self:center;color:var(--muted)}
.checkpt{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;border:2px dashed var(--goldfill);border-radius:12px;padding:12px 14px;background:var(--goldsoft)}

.fivef{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fcard{border-radius:12px;padding:16px;background:var(--surface2);border-top:4px solid var(--goldfill)}
.fcard b{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:22px;display:block;margin-bottom:6px}
.fcard span{font-size:14px;color:var(--muted)}

/* Room pause */
.pause{border:1px solid var(--goldfill);background:linear-gradient(180deg,var(--goldsoft),var(--surface) 70%);border-radius:14px;padding:22px}
.pause .q{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:23px;line-height:1.3;margin:2px 0 14px}
.pause .lab{font-size:13px;font-weight:600;color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:var(--ink);font-weight:500}
.opt:hover{border-color:var(--goldfill)}
.opt.right{background:var(--greensoft);border-color:var(--green)}
.opt.wrong{background:var(--redsoft);border-color:var(--red)}
.why{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--surface2);font-size:15px}
.hint{color:var(--muted);font-size:13.5px;margin-top:10px}

/* Exercise */
.steps{margin:0 0 14px;padding-left:20px}
.steps li{margin:5px 0}
.prompt{position:relative;background:var(--navy);color:var(--onnavy);border-radius:12px;padding:50px 18px 18px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-x:auto}
.copy{position:absolute;top:10px;right:10px;background:var(--goldfill);color:var(--navy);border:none;border-radius:7px;padding:6px 11px;font-weight:600;font-size:13px}
.leave{margin-top:24px;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.leave b{color:var(--green)}
.notes{margin-top:24px;border-radius:12px;padding:18px 20px;background:var(--surface2);border:1px dashed var(--muted);white-space:pre-wrap;font-size:15px}
.notes h3{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:var(--muted);margin-bottom:6px}
.snav{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.nbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 15px;color:var(--ink);text-align:left;max-width:48%}
.nbtn small{display:block;color:var(--muted);font-size:12.5px}
.nbtn:hover{border-color:var(--goldfill)}
.donebtn{background:var(--surface);border:1px solid var(--green);color:var(--green);border-radius:10px;padding:9px 14px;font-weight:600}
.donebtn.is{background:var(--green);color:var(--surface)}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface2)}
tr:last-child td{border-bottom:none}
.safety{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:22px 24px}
.safety h3{font-size:22px;color:var(--goldfill);margin-bottom:8px}
.safety ul{margin:0;padding-left:20px;columns:2;column-gap:28px}
.safety li{margin:4px 0;break-inside:avoid}
.plib{display:grid;gap:14px}
.plib .meta{font-size:13.5px;color:var(--muted);margin-bottom:6px}

/* Present mode */
.stage{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.stage[hidden]{display:none}
.stagebar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 10px;background:var(--navy);color:var(--onnavy);border-bottom:3px solid var(--goldfill)}
.stagebar .where{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--onnavymuted)}
.stagebar .cnt{font-variant-numeric:tabular-nums;font-size:14px}
.slide{flex:1;overflow:auto;padding:clamp(24px,5vh,60px) clamp(20px,6vw,96px)}
.slide .inner{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.slide .stitle{font-size:clamp(38px,5.6vw,72px)}
.slide .slede{font-size:clamp(24px,2.8vw,34px);max-width:36ch}
.slide .pause .q{font-size:clamp(26px,3vw,38px)}
.slide .opt{font-size:19px;padding:18px}
.slide .prompt{font-size:16px}
.slide .fstep b{font-size:19px}.slide .fstep span{font-size:16px}
.slide .gcell{font-size:17px}
.stagenotes{background:var(--surface2);border-top:1px solid var(--line);padding:14px 24px calc(env(safe-area-inset-bottom,0px) + 14px);white-space:pre-wrap;font-size:15px;max-height:28vh;overflow:auto}
.titleslide{min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.titleslide .k{color:var(--gold);font-weight:600;font-size:18px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--navy);color:var(--onnavy);padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}

@media (max-width:900px){
  .menu{display:inline-flex}
  .tabs{display:none}
  .mnav{display:block!important}
  .side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:45;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
  .side.open{transform:none;visibility:visible;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .tools{margin-left:auto}
  .chapters{grid-template-columns:1fr}
  .eradetail{grid-template-columns:1fr}
  .fivef{grid-template-columns:1fr 1fr}
  .agentv{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:center}
  .tbtn .lbl{display:none}
  .rail{grid-template-columns:repeat(var(--n),minmax(92px,1fr));overflow-x:auto;padding-bottom:6px}
  .safety ul{columns:1}
}
@media (max-width:600px){
  .arow{grid-template-columns:1fr 24px}.arow .t{grid-column:1}.arow .m{display:none}
  .break{padding-left:6px}
  .compare{grid-template-columns:1fr}
  .wordmark span{display:none}
  .nbtn{max-width:100%;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---- Interactive additions ---- */
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px}
.pill:hover:not([disabled]){border-color:var(--goldfill)}
.pill.solid{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
:root[data-theme="dark"] .pill.solid{background:var(--goldfill);color:#0E1F3D;border-color:var(--goldfill)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.solid{background:var(--goldfill);color:#0E1F3D;border-color:var(--goldfill)}}
.pill.ok{border-color:var(--green);color:var(--green)}
.pill.bad{border-color:var(--red);color:var(--red)}
.pill[disabled]{opacity:.45;cursor:default}
.flowctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.flowctl .hint{margin:0 auto 0 0}
.hint{color:var(--muted);font-size:13.5px}
.sec{font-size:24px;margin:40px 0 12px}
.verdict{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--greensoft);color:var(--ink);border-left:4px solid var(--green)}
.verdict.bad{background:var(--redsoft);border-left-color:var(--red)}
.empty{padding:18px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:10px;grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.chip:hover{border-color:var(--goldfill)}
.chip.on{background:var(--goldfill);color:#0E1F3D;border-color:var(--goldfill)}
kbd{display:inline-block;min-width:20px;text-align:center;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;font:12px/1.6 inherit;color:var(--ink);background:var(--surface)}
.keys{padding:0 10px;color:var(--muted);font-size:13px;line-height:2.1}
.prog{display:block;height:4px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:3px}
.sideprog{margin:-4px 10px 12px;font-size:12.5px;color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:end}
.herostats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.herostats div{border:1px solid #2B4170;border-radius:12px;padding:14px 16px}
.herostats b{display:block;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:42px;line-height:1;color:var(--goldfill)}
.herostats span{color:var(--onnavymuted);font-size:14px}
.rail::after{content:"";position:absolute;left:6%;top:29px;height:3px;background:var(--goldfill);border-radius:2px;width:0;animation:draw 1.6s ease-out .2s forwards}
@keyframes draw{to{width:88%}}

/* eras */
.eractl{display:flex;align-items:center;gap:14px;margin-top:6px;flex-wrap:wrap}
.eractl input[type=range]{flex:1;min-width:160px;accent-color:#E3B341}
.era.past .dot{opacity:.75}
.eradetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:22px;align-items:start}
.eraleft small{color:var(--muted);font-size:13px}
.eraleft h3{font-size:28px;margin:2px 0 10px}
.eraleft .lesson{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:22px;line-height:1.3;margin:0;padding:0;border:none;color:var(--gold)}
.eraright{display:grid;gap:10px}
.facet{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border-radius:10px;padding:10px 12px}
.facet .fi{font-size:22px;line-height:1}
.facet b{display:block;font-size:13px;color:var(--muted)}

/* glance strips */
.glance{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;margin:8px 0}
.glabel{background:none;border:none;text-align:left;color:var(--ink);padding:0}
.glabel b{display:block}.glabel span{color:var(--muted);font-size:14px}
.strip{display:flex;height:46px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.strip.small{height:26px;margin-bottom:16px}
.glance .strip.small{margin:0}
.seg{border:none;border-right:1px solid var(--bg);background:var(--navy2);color:var(--onnavy);padding:0;min-width:0;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden}
.seg:nth-child(odd):not(.brk){background:var(--navy)}
.seg.done{background:var(--green)!important}
.seg.cur{background:var(--goldfill)!important;color:#0E1F3D}
.seg:hover:not(.brk){filter:brightness(1.25)}
.seg.brk{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 6px,var(--line) 6px,var(--line) 7px);color:var(--muted);font-weight:500}
.seg span{white-space:nowrap;overflow:hidden;text-overflow:clip;padding:0 2px}
.stripaxis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.chapters .chapter .beat{margin-top:8px}

/* day overview */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpis b{display:block;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:34px;line-height:1.05;color:var(--gold)}
.kpis span{color:var(--muted);font-size:13.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:24px 0}
.scard{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:150px}
.scard:hover{border-color:var(--goldfill);transform:translateY(-2px)}
.scard.done{border-color:var(--green)}
.scard .sic{font-size:26px;line-height:1}
.scard .st{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.scard b{font-size:16px;line-height:1.3}
.badges{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.badges i{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--goldsoft);color:var(--gold)}
.badges i.okb{background:var(--greensoft);color:var(--green)}

/* flow stepper */
.flowx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.track{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.node{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:var(--muted);padding:4px 6px;min-width:84px}
.node .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface2);font-weight:600;color:var(--muted);transition:all .2s}
.node .lbl{font-size:13.5px;font-weight:600;text-align:center;max-width:110px}
.node.past .n{background:var(--navy);border-color:var(--navy);color:var(--goldfill)}
.node.cur .n{background:var(--goldfill);border-color:var(--goldfill);color:#0E1F3D;transform:scale(1.12)}
.node.cur .lbl{color:var(--ink)}
.link{flex:1;min-width:24px;height:3px;background:var(--line);margin-bottom:24px;border-radius:2px}
.link.lit{background:var(--goldfill)}
.flowdetail{margin-top:14px;padding:16px 18px;border-radius:12px;background:var(--goldsoft);display:flex;flex-direction:column;gap:2px}
.flowdetail b{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:22px}
.flowdetail span{font-size:16.5px}

/* flip cards */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.flip{min-height:118px;border-radius:12px;border:1px solid var(--line);background:var(--navy);color:var(--onnavy);text-align:left;padding:16px;position:relative}
.flip .front{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:24px;display:flex;flex-direction:column;gap:6px}
.flip .front small{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;color:var(--onnavymuted)}
.flip .back{display:none}
.flip.open{background:var(--goldsoft);color:var(--ink);border-color:var(--goldfill)}
.flip.open .front{display:none}
.flip.open .back{display:block;font-size:15px}
.flip.open .back b{display:block;color:var(--gold);margin-bottom:4px}

/* compare toggle */
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface2);gap:3px;flex-wrap:wrap}
.seg2 button{border:none;background:none;color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.seg2 button[aria-selected="true"]{background:var(--navy);color:var(--onnavy)}
.seg2.sm button{padding:6px 12px}
.cmpbody{margin-top:12px;border-radius:12px;padding:16px 20px;border:1px solid var(--line);background:var(--surface)}
.cmpbody.r{background:var(--goldsoft);border-color:var(--goldfill)}
.cmpbody ul{margin:0;padding-left:20px;font-size:17px}
.cmpbody li{margin:6px 0}

/* 5F */
.fcard{text-align:left;border:none;color:var(--ink);cursor:pointer;min-height:120px}
.fcard.open{background:var(--goldsoft)}
.fcard.open span{color:var(--ink)}

/* agent run */
.agentrun{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.pipe{display:grid;gap:8px}
.astep{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface2);color:var(--muted);transition:all .25s}
.astep .n{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-weight:600;font-size:13px}
.astep.live{background:var(--navy);color:var(--onnavy)}
.astep.live .n{border-color:var(--goldfill);color:var(--goldfill)}
.astep.ok{color:var(--ink)}
.astep.ok .n{background:var(--green);border-color:var(--green);color:#fff}
.checkpt{flex-direction:column;opacity:.7}
.checkpt.live{opacity:1;box-shadow:0 0 0 4px var(--goldsoft)}
.vbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* builder */
.builder .bwrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px}
.meter{background:var(--navy);color:var(--onnavy);border-radius:12px;padding:16px}
.mnum{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:52px;line-height:1;color:var(--goldfill)}
.mlbl{font-size:13.5px;color:var(--onnavymuted);margin:4px 0 10px}
.mbar{height:8px;border-radius:4px;background:#22355E;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--goldfill);transition:width .3s}
.meter .hint{color:var(--onnavymuted);margin-top:10px;font-size:12px}
.prompt.live{min-height:180px}
.prompt b{color:var(--goldfill);font-weight:600}
.ghost{color:var(--onnavymuted)}

/* spot */
.spot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.spothead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.spothead .score{font-weight:600;color:var(--gold)}
.spottext{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:21px;line-height:1.9;margin:14px 0}
.err{font:inherit;background:none;border:none;border-bottom:2px dotted transparent;color:inherit;padding:0 2px;border-radius:4px;cursor:pointer;display:inline}
.err:hover{background:var(--surface2);border-bottom-color:var(--muted)}
.err.hit{background:var(--redsoft);border-bottom-color:var(--red)}
.tagf{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:11.5px;font-weight:600;background:var(--red);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.spotfound{display:grid;gap:6px;font-size:15px}
.spotfound b{color:var(--red)}

/* archive search */
.search{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.sbox{width:100%;font:inherit;font-size:17px;padding:13px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}
.sbox:focus{border-color:var(--goldfill);outline:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.thumb{height:92px;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 45% 62%),hsl(calc(var(--h) + 30) 40% 40%))}
.thumb svg{width:54px;fill:rgba(255,255,255,.85)}
.play{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:16px}
.tcap{padding:10px 12px 4px;font-size:14px;font-weight:500;line-height:1.35}
.ttags{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 12px}
.ttags span{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.ttags span.m{background:var(--goldfill);border-color:var(--goldfill);color:#0E1F3D}

/* faces */
.beforeafter{position:relative;margin-top:14px;max-width:420px;aspect-ratio:1/1;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.ba{position:absolute;inset:0}
.ba.after{clip-path:inset(0 0 0 var(--p))}
.ba .face{width:100%;height:100%;display:block}
.ba.before .face{filter:blur(2.4px) saturate(.75)}
.balbl{position:absolute;left:8px;bottom:8px;background:rgba(14,31,61,.85);color:#fff;font-size:12.5px;padding:3px 8px;border-radius:6px}
.beforeafter input{position:absolute;inset:0;z-index:3;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.beforeafter::after{content:"";position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1px;background:var(--goldfill);pointer-events:none}
.beforeafter::before{content:"";background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%230E1F3D%27 stroke-width=%272.4%27%3E%3Cpath d=%27m9 6-6 6 6 6M15 6l6 6-6 6%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:center;background-size:60%;position:absolute;z-index:2;top:50%;left:var(--p);transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background-color:var(--goldfill);color:#0E1F3D;display:grid;place-items:center;font-weight:700;pointer-events:none}
.balbl.r{left:auto;right:8px}

/* template */
.tpl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.tplctl{display:flex;flex-direction:column;gap:12px}
.tplctl label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted);font-weight:600}
.tplctl select,.tplctl input,.sgrid input,.sgrid3 input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.switch{display:inline-flex;align-items:center;gap:10px;background:none;border:none;color:var(--ink);font-weight:600;padding:0}
.switch i{width:44px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on i{background:var(--green)}
.switch.on i::after{left:23px}
.tplcard{aspect-ratio:4/5;border-radius:14px;color:#fff;padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;max-width:340px;width:100%;justify-self:center}
.tlogo{align-self:flex-start;font-size:12px;font-weight:600;border:1.5px dashed rgba(255,255,255,.7);border-radius:6px;padding:4px 8px}
.tlogo.off{transform:scaleX(1.6) rotate(-4deg);transform-origin:left;margin-left:6px}
.tocc{font-size:13px;color:#E3B341;font-weight:600}
.thead{font-size:30px;line-height:1.1}
.tphoto{flex:1;border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));display:grid;place-items:center;font-size:13px;color:rgba(255,255,255,.8);text-align:center;padding:10px}
.tband{height:8px;border-radius:4px;background:#E3B341}

/* formats */
.fmts{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.fstage{min-height:360px;display:grid;place-items:center;background:var(--surface2);border-radius:12px;padding:10px}
.frame{transition:width .35s,height .35s;border-radius:8px;overflow:hidden;box-shadow:0 8px 28px rgba(14,31,61,.22)}
.kv{position:relative;width:100%;height:100%;background:linear-gradient(180deg,#F7C873,#E3B341 45%,#16305C 46%,#0E1F3D)}
.kv .sun{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;background:#FFF4D6;left:50%;top:22%;transform:translate(-50%,-50%)}
.kv .hill{position:absolute;left:-10%;right:-10%;bottom:30%;height:22%;background:#2E6B4A;border-radius:50% 50% 0 0}
.kvt{position:absolute;left:8%;right:8%;bottom:9%;color:#fff;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:clamp(14px,2.4vw,26px);font-weight:600}
.kvl{position:absolute;top:6%;left:6%;font-size:11px;font-weight:700;color:#0E1F3D;background:#fff;border-radius:4px;padding:2px 6px}

/* storyboard */
.sb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.sbbar{display:flex;gap:4px;height:84px}
.sbseg{min-width:0;border:none;border-radius:10px;background:var(--navy);color:var(--onnavy);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:8px 10px;overflow:hidden;text-align:left;transition:flex .3s}
.sbseg:nth-child(even){background:var(--navy2)}
.sbseg b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sbseg span{font-size:12.5px;color:var(--goldfill)}
.sbseg.cur{background:var(--goldfill);color:#0E1F3D}
.sbseg.cur span{color:#0E1F3D}
.sbinfo{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;margin-top:14px}
.tot{border-radius:12px;padding:14px;background:var(--greensoft);font-size:13.5px}
.tot.bad{background:var(--redsoft)}
.tot b{display:block;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:38px;line-height:1}
.sbsel{border-radius:12px;padding:14px;background:var(--surface2)}
.sbsel b{display:block;font-size:17px}
.sbsel .flowctl{margin-top:8px}

/* back-translation */
.bt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:8px}
.btrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:10px;background:var(--surface2);font-size:18px}
.btrow.back{background:var(--goldsoft)}
.btk{font-size:13px;font-weight:600;color:var(--muted);padding-top:3px}
mark{background:var(--red);color:#fff;border-radius:4px;padding:0 4px}

/* newsroom */
.news{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.clock{display:flex;align-items:baseline;gap:12px}
.clock span{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock small{color:var(--muted)}
.clock.warn span{color:var(--red)}
.feed{display:grid;gap:8px;margin-top:14px}
.fitem{padding:12px 14px;border-radius:10px;background:var(--surface2);border-left:4px solid var(--navy2);font-size:15.5px}
.fitem.new{background:var(--goldsoft);border-left-color:var(--goldfill);font-weight:600}
.fitem.inject{border-left-color:var(--red)}

/* scores & charts */
.scores{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel .scores{border:none;padding:0}
.sgrid{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:center;margin-bottom:12px;font-size:13.5px}
.sgrid b{color:var(--muted);font-weight:600}
.glbl{font-weight:600}
.sgrid3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end;margin-top:14px}
.sgrid3 label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chart{width:100%;max-width:560px;height:auto;display:block}
.chart .gl{stroke:var(--line)}
.chart .ax{fill:var(--muted);font-size:12px}
.chart .val{fill:var(--ink);font-size:12px;font-weight:600}
.bar.s1{fill:var(--sepia)}.bar.s2{fill:var(--goldfill)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.s1{background:var(--sepia)}.sw.s2{background:var(--goldfill)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.board{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:90px minmax(0,1fr) 44px auto auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.brow.lead{border-color:var(--goldfill);box-shadow:0 0 0 3px var(--goldsoft)}
.btrack{height:18px;border-radius:9px;background:var(--surface2);overflow:hidden}
.btrack i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--goldfill));border-radius:9px;transition:width .4s}
.bpts{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:26px;text-align:right}

/* pause votes */
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;min-height:52px}
.ofill{position:absolute;inset:0 auto 0 0;background:var(--goldsoft);transition:width .35s;z-index:0}
.otext,.opct{position:relative;z-index:1}
.opct{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt.right{background:var(--greensoft);border-color:var(--green)}
.opt.right .ofill{background:rgba(34,107,73,.18)}
.opt.dim{opacity:.55}

/* exercise checklist */
.panel.ex h3{font-size:21px;margin-bottom:10px}
.checks{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.ck{width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--ink);font-size:15.5px}
.ck i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff}
.ck.on{background:var(--greensoft);border-color:var(--green)}
.ck.on i{background:var(--green);border-color:var(--green)}
.pdet{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.pdet summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--gold)}
.pdet[open] summary{border-bottom:1px solid var(--line)}
.pdet .prompt{border-radius:0}
.plib{display:grid;gap:10px;margin-top:12px}
.plib summary{color:var(--ink);font-weight:500}
.plib summary b{color:var(--gold);margin-right:6px}

/* agents map */
.agentlay{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center;margin-top:20px}
.amap{width:100%;height:auto}
.alink{stroke:var(--line);stroke-width:3;stroke-dasharray:6 6}
.alink.on{stroke:var(--goldfill);stroke-dasharray:none}
.hub circle{fill:var(--navy)}
.hub text{fill:var(--onnavy);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:20px;font-weight:600}
.hub text.sm{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:var(--onnavymuted);font-weight:400}
.anode{cursor:pointer}
.anode circle{fill:var(--surface);stroke:var(--navy2);stroke-width:3;transition:all .2s}
.anode .num{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:22px;font-weight:600;fill:var(--ink)}
.anode.on circle{fill:var(--goldfill);stroke:var(--goldfill)}
.anode.on .num{fill:#0E1F3D}
.alab{fill:var(--muted);font-size:13px;font-weight:600}
.anode.on .alab{fill:var(--gold)}
.anode:focus-visible circle{stroke:var(--goldfill)}
.apanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.apanel .anum{color:var(--gold);font-weight:600;font-size:14px}
.apanel h3{font-size:26px;margin:4px 0 8px}
.apanel dl{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:14.5px;margin:14px 0 0}
.apanel dt{color:var(--muted);font-weight:600}.apanel dd{margin:0}

/* toolkit */
.nogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.nogrid span{background:#14284B;border-radius:9px;padding:10px 12px;font-size:14.5px}
.toolcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.toolc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.toolc b{display:block;margin-bottom:8px}
.tp{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tchip{font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.tchip.p{background:var(--goldfill);border-color:var(--goldfill);color:#0E1F3D;font-weight:600}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.kitc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;position:relative}
.kitc .kn{position:absolute;top:12px;right:14px;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:26px;color:var(--line)}
.kitc b{font-size:17px}.kitc span{font-size:14px;color:var(--muted)}.kitc small{margin-top:auto;color:var(--gold);font-weight:600}

/* stage */
.sprog{height:4px;background:var(--line)}
.sprog i{display:block;height:100%;background:var(--goldfill);transition:width .3s}
.slideh{font-size:clamp(26px,3vw,40px);margin-bottom:18px}
.slide .titleslide .strip{margin-top:28px}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .eradetail{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .builder .bwrap,.tpl,.two,.agentlay,.sbinfo{grid-template-columns:1fr}
  .glance{grid-template-columns:1fr}
  .sgrid3{grid-template-columns:1fr 1fr}
  .brow{grid-template-columns:70px minmax(0,1fr) 34px;}
  .brow .pill{grid-column:span 1}
  .btrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.rail::after{animation:none;width:88%}}


/* client-facing additions */
.wordmark b{letter-spacing:.16em}
.hero .prepared{color:var(--goldfill);font-size:14px;font-weight:600;margin-bottom:12px}
.facet .fi{color:var(--gold);padding-top:2px}
.facet .fi .ic{width:22px;height:22px}
.scard .sic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--goldsoft);color:var(--gold);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;font-weight:600}
.sitem .t{min-width:92px}
.chip .ic{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.nogrid span{display:inline-flex;align-items:center;gap:6px}
.nogrid .ic{width:15px;height:15px;color:var(--red)}
.astep .n .ic,.ck i .ic{width:14px;height:14px}
.play{display:grid;place-items:center}
.dayacts{margin-top:18px}
.pill .ic{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.facts{display:grid;gap:10px;padding:2px 10px}
.facts div{font-size:14px;line-height:1.4}
.facts b{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:6px 0 10px}
.people.two-up{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.person{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.person.big{border-top:3px solid var(--goldfill)}
.pphoto{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--goldsoft);background:var(--surface2)}
.person.big .pphoto{width:96px;height:96px}
.pphoto.ini{display:grid;place-items:center;background:var(--navy);color:var(--goldfill);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:30px;font-weight:600}
.pbody{min-width:0}
.pbody h3{font-size:21px;line-height:1.2}
.prole{color:var(--gold);font-size:14px;font-weight:600;margin-top:3px}
.plines{margin:10px 0 0;padding-left:18px;font-size:14.5px;color:var(--ink)}
.plines li{margin:3px 0}
.plinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.plink{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.plink:hover{border-color:var(--goldfill)}
.plink .ic{width:14px;height:14px}
.people.adv .pphoto{width:68px;height:68px}
.people.adv .pbody h3{font-size:18px}
.reclist{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.reclist li{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--goldfill);border-radius:0 10px 10px 0;padding:10px 14px;font-size:15px}
.contact{margin-top:34px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;background:var(--navy);color:var(--onnavy);border-radius:14px;padding:20px 22px}
.contact b{display:block;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:22px}
.contact span{color:var(--onnavymuted);font-size:14px}
.contact .plink{color:var(--onnavy);border-color:#2B4170}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.refc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column}
.refhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.refhead h3{font-size:20px}
.refwhen{font-size:12.5px;color:var(--gold);font-weight:600}
.refc p{margin:8px 0 0;color:var(--muted);font-size:14.5px}
.refsteps{margin:10px 0 0;padding-left:20px;font-size:14px}
.refsteps li{margin:3px 0}
.refc .plinks{margin-top:0;padding-top:8px}
.refurl{margin-top:auto;padding-top:14px;font-size:13px;color:var(--muted)}
.reflink{white-space:nowrap}
a.pill{text-decoration:none;display:inline-flex;align-items:center}
@media (max-width:620px){.person{flex-direction:column}.people.two-up{grid-template-columns:1fr}}

/* colour refresh: navy and gold base, with red, white and green accents */
:root{--red2:#D62F43;--red2soft:#FBE4E7;--green2:#14905F;--green2soft:#DDF3E9;--white2:#FFFFFF;
  --stripe:linear-gradient(90deg,var(--red2) 0 33.3%,#FFFFFF 33.3% 66.6%,var(--green2) 66.6% 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red2:#FF5F72;--red2soft:#3A1419;--green2:#3CCB8F;--green2soft:#10301F}}
:root[data-theme="dark"]{--red2:#FF5F72;--red2soft:#3A1419;--green2:#3CCB8F;--green2soft:#10301F}
.bar{border-bottom:0;box-shadow:none}
.bar{padding-bottom:14px}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--stripe)}
.brandlink{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.logomark{width:40px;height:40px;border-radius:10px;display:block;box-shadow:0 0 0 1px #2B4170}
.logomark.sm{width:30px;height:30px;border-radius:8px}
.tab[aria-current="page"]{background:#FFFFFF;color:var(--navy);box-shadow:inset 0 -3px 0 var(--red2)}
.tab:hover{background:#18305A}
.hero{background:radial-gradient(520px 320px at 100% 0%,rgba(214,47,67,.38),transparent 70%),radial-gradient(480px 300px at 0% 100%,rgba(20,144,95,.34),transparent 70%),var(--navy)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--stripe)}
.heroside{display:flex;flex-direction:column;gap:14px;align-items:flex-end}
.herologo{width:120px;height:120px;border-radius:22px;box-shadow:0 0 0 1px #2B4170,0 12px 30px rgba(0,0,0,.35)}
.herostats{width:100%}
.herostats div:nth-child(1) b{color:#FFFFFF}
.herostats div:nth-child(2) b{color:var(--goldfill)}
.herostats div:nth-child(3) b{color:#FF7A89}
.herostats div:nth-child(4) b{color:#5FE0A6}
.herostats div:nth-child(3){border-color:rgba(255,95,114,.45)}
.herostats div:nth-child(4){border-color:rgba(60,203,143,.45)}
.hero .prepared{display:inline-block;background:var(--red2);color:#FFFFFF;padding:4px 12px;border-radius:999px;font-size:13px}
.hero .who span:nth-child(2){border-left-color:var(--green2)}
.chapter{border-top:5px solid var(--dc,var(--goldfill))}
.chapter:hover{border-color:var(--dc,var(--goldfill))}
.chapter .k{color:var(--dc)}
.daycol .k{color:var(--dc)}
.daycol h1{text-decoration:underline;text-decoration-color:var(--dc);text-decoration-thickness:5px;text-underline-offset:10px}
.scard .sic{background:var(--dc,var(--goldfill));color:#FFFFFF}
.scard:hover{border-color:var(--dc,var(--goldfill))}
.badges i.qb{background:var(--red2soft);color:var(--red2)}
.badges i.exb{background:var(--green2soft);color:var(--green2)}
.chip.on{background:var(--red2);color:#FFFFFF;border-color:var(--red2)}
.pill.solid{background:var(--navy);border-color:var(--navy)}
.pill.solid:hover:not([disabled]){background:var(--red2);border-color:var(--red2);color:#FFFFFF}
.sec{display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:22px;height:6px;border-radius:3px;background:var(--stripe);box-shadow:0 0 0 1px var(--line);flex:none}
.leave{border-left:5px solid var(--green2)}
.leave b{color:var(--green2)}
.beatbox{background:var(--red2soft);border-left-color:var(--red2)}
.beatbox small{color:var(--red2)}
.person.big{border-top-color:var(--red2)}
.people .person:nth-child(3n+2) .pphoto{border-color:var(--green2soft)}
.prole{color:var(--red2)}
.reclist li{border-left-color:var(--green2)}
.refwhen{color:var(--green2)}
.refc{border-top:4px solid transparent}
.refgrid .refc:nth-child(3n+1){border-top-color:var(--red2)}
.refgrid .refc:nth-child(3n+2){border-top-color:var(--goldfill)}
.refgrid .refc:nth-child(3n){border-top-color:var(--green2)}
.contact{position:relative;overflow:hidden;justify-content:flex-start}
.contact::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--stripe)}
.contactlogo{width:96px;height:96px;border-radius:16px;flex:none}
.contact .ctext{flex:1;min-width:200px}
.plink.li,.contact .plink.li{background:#0A66C2;border-color:#0A66C2;color:#FFFFFF;font-weight:600}
.plink.li:hover{background:#004182;border-color:#004182;color:#FFFFFF}
.tbtn.insta{text-decoration:none;background:transparent;border:1px solid rgba(255,255,255,.55);color:#FFFFFF;position:relative;overflow:hidden}
.tbtn.insta::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--stripe)}
.tbtn.insta:hover{background:#FFFFFF;color:var(--navy);border-color:#FFFFFF}
.reccols{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.sprog i{background:var(--stripe)!important}
@media (max-width:900px){.heroside{align-items:flex-start}.herologo{display:none}}
@media (max-width:620px){.wordmark span{display:none}.logomark{width:34px;height:34px}}

/* ===== Grok-inspired restyle: black base, quiet type, small red, white and green accents ===== */
:root[data-theme="dark"],:root:not([data-theme="light"]){
  --bg:#000000;--surface:#0E0E0F;--surface2:#070708;--ink:#F4F4F5;--muted:#8B8B92;--line:#202024;
  --navy:#000000;--navy2:#141416;--gold:#E3B341;--goldfill:#E3B341;--goldsoft:#1C1708;
  --red2:#FF5468;--red2soft:#2A0C11;--green2:#34D399;--green2soft:#0A2419;--green:#34D399;--greensoft:#0A2419;--red:#FF5468;--redsoft:#2A0C11;
  --onnavy:#F4F4F5;--onnavymuted:#8B8B92;color-scheme:dark}
:root[data-theme="light"]{
  --bg:#FFFFFF;--surface:#F6F6F7;--surface2:#FAFAFA;--ink:#0A0A0B;--muted:#6B6B73;--line:#E6E6E9;
  --navy:#0A0A0B;--navy2:#1B1B1F;--gold:#9C7414;--goldfill:#E3B341;--goldsoft:#FBF3DD;
  --red2:#D62F43;--red2soft:#FCE8EB;--green2:#13875A;--green2soft:#E2F5EC;--onnavy:#F4F4F5;--onnavymuted:#A1A1A8;color-scheme:light}
body{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.005em}
h1,h2,h3,.serif{font-weight:600;letter-spacing:-.025em}
:root{--stripe:linear-gradient(90deg,var(--red2) 0 33.3%,#FFFFFF 33.3% 66.6%,var(--green2) 66.6% 100%)}
/* header */
.bar{background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);color:var(--ink);border-bottom:1px solid var(--line);padding:10px 18px}
.bar::after{height:2px;bottom:-1px;opacity:.9}
body::before{background:var(--bg)}
.wordmark b{color:var(--ink);letter-spacing:.14em;font-weight:600}
.wordmark span{color:var(--muted)}
.logomark{box-shadow:0 0 0 1px var(--line);border-radius:12px}
.tabs{gap:2px}
.tab{color:var(--muted);border-radius:999px;padding:7px 14px;font-weight:500}
.tab:hover{color:var(--ink);background:var(--surface)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 13px}
.tbtn:hover{border-color:var(--muted)}
.tbtn.present{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbtn.insta{border-color:var(--line);color:var(--ink)}
.tbtn.insta:hover{background:var(--ink);color:var(--bg)}
.menu{border-color:var(--line);color:var(--ink);border-radius:999px}
/* sidebar */
.side{background:var(--bg);border-right:1px solid var(--line)}
.sitem{border-radius:10px;border-left:0;padding:8px 10px}
.sitem:hover{background:var(--surface)}
.sitem.cur{background:var(--surface);box-shadow:inset 2px 0 0 var(--red2);font-weight:600}
/* centred hero */
.hx{text-align:center;padding:clamp(28px,7vw,84px) 8px 8px;position:relative}
.hx::before{content:"";position:absolute;inset:0 0 auto;height:420px;z-index:-1;background:radial-gradient(420px 220px at 30% 30%,color-mix(in srgb,var(--red2) 14%,transparent),transparent 70%),radial-gradient(420px 220px at 70% 40%,color-mix(in srgb,var(--green2) 12%,transparent),transparent 70%);pointer-events:none}
.hxlogo{width:88px;height:88px;border-radius:22px;box-shadow:0 0 0 1px var(--line);margin:0 auto 22px;display:block}
.hx .prepared{display:inline-block;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500}
.hx .prepared::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green2);margin-right:8px;vertical-align:1px}
.hx h1{font-size:clamp(36px,6vw,68px);line-height:1.02;margin:18px auto 0;max-width:16ch;font-weight:600;letter-spacing:-.035em}
.hxsub{color:var(--muted);max-width:60ch;margin:18px auto 0;font-size:17px;line-height:1.6}
.ask{display:flex;align-items:center;gap:12px;max-width:640px;margin:34px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 20px;transition:border-color .2s}
.ask:focus-within{border-color:var(--muted)}
.ask .ic{color:var(--muted);width:20px;height:20px}
.ask input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-size:16.5px;padding:12px 0;outline:none}
.ask input::placeholder{color:var(--muted)}
.hxchips{justify-content:center;margin-top:14px}
.chip{background:transparent;border-color:var(--line);color:var(--muted);border-radius:999px}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.askres{max-width:640px;margin:14px auto 0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px}
.askres.empty{padding:14px 18px;color:var(--muted);font-size:14.5px}
.arow{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:12px;align-items:flex-start}
.arow:hover{background:var(--surface2)}
.arow .ak{flex:none;min-width:64px;font-size:12.5px;color:var(--red2);font-weight:600;padding-top:2px}
.arow .at b{display:block;font-weight:600;font-size:15px}
.arow .at small{color:var(--muted);font-size:13.5px}
.amore{padding:6px 12px 8px;color:var(--muted);font-size:13px}
.hxmeta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;margin-top:30px;color:var(--muted);font-size:14.5px}
.hxmeta span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red2);margin-right:8px;vertical-align:2px}
.hxmeta span:nth-child(2)::before{background:var(--green2)}
.hxstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:640px;margin:26px auto 0;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hxstats div{padding:16px 10px;border-left:1px solid var(--line)}
.hxstats div:first-child{border-left:0}
.hxstats b{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em}
.hxstats span{color:var(--muted);font-size:13px}
.thesis{text-align:center;margin:70px auto 10px;font-weight:500;letter-spacing:-.02em}
/* surfaces */
.scard,.chapter,.kpis div,.panel,.flowx,.refc,.person,.leave,.toolc,.kitc,.apanel{background:var(--surface);border-color:var(--line);border-radius:18px}
.scard:hover,.chapter:hover{transform:none;border-color:var(--muted)}
.chapter{border-top:1px solid var(--line);box-shadow:inset 0 3px 0 var(--dc,var(--goldfill))}
.kpis b,.herostats b{color:var(--ink);font-weight:600}
.dayhead .k,.daycol .k{color:var(--dc,var(--muted))}
.daycol h1{text-decoration:none}
.daycol h1::after{content:"";display:block;width:56px;height:3px;border-radius:2px;background:var(--dc);margin-top:14px}
.beatbox{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--red2);border-radius:14px;font-size:18px}
.leave{border-left:3px solid var(--green2)}
.pill{background:transparent;border-color:var(--line);color:var(--ink)}
.pill:hover:not([disabled]){border-color:var(--muted)}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.solid:hover:not([disabled]){background:var(--ink);color:var(--bg);opacity:.86}
.sec::before{width:18px;height:3px}
.seg{background:var(--navy2)!important;color:var(--ink)}
.seg:nth-child(odd):not(.brk){background:#1E1E22!important}
:root[data-theme="light"] .seg{background:#E9E9EC!important;color:var(--ink)}
:root[data-theme="light"] .seg:nth-child(odd):not(.brk){background:#DCDCE1!important}
.seg.cur{background:var(--red2)!important;color:#FFFFFF}
.seg.done{background:var(--green2)!important;color:#000000}
.strip{border-color:var(--line);border-radius:12px}
.nogrid span{background:var(--surface2);border:1px solid var(--line)}
.block.safety{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:18px}
.block.safety h3{color:var(--ink)}
.contact{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:18px}
.contact span{color:var(--muted)}
.contact .plink{color:var(--ink);border-color:var(--line)}
.plink{border-color:var(--line)}
.prole{color:var(--muted);font-weight:500}
.person.big{border-top:1px solid var(--line);box-shadow:inset 0 3px 0 var(--red2)}
.pphoto{border-color:var(--line)}
.pphoto.ini{background:var(--surface2);color:var(--ink)}
.reclist li{background:var(--surface);border-color:var(--line);border-left:3px solid var(--green2);border-radius:12px}
.refc{border-top:1px solid var(--line)}
.refgrid .refc:nth-child(3n+1){box-shadow:inset 0 2px 0 var(--red2)}
.refgrid .refc:nth-child(3n+2){box-shadow:inset 0 2px 0 #FFFFFF}
.refgrid .refc:nth-child(3n){box-shadow:inset 0 2px 0 var(--green2)}
:root[data-theme="light"] .refgrid .refc:nth-child(3n+2){box-shadow:inset 0 2px 0 var(--line)}
.refgrid .refc:nth-child(3n+1),.refgrid .refc:nth-child(3n+2),.refgrid .refc:nth-child(3n){border-top-color:var(--line)}
.refwhen{color:var(--muted)}
.badges i{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badges i.qb{color:var(--red2);background:transparent}
.badges i.exb{color:var(--green2);background:transparent}
.scard .sic{background:transparent;border:1px solid var(--line);color:var(--dc,var(--ink))}
.stage,.stagebar{background:var(--bg)}
.stagebar{border-bottom:1px solid var(--line);color:var(--ink)}
.prompt{background:var(--surface2);border-color:var(--line);border-radius:14px}
@media (max-width:620px){.hxstats{grid-template-columns:repeat(2,1fr)}.hxstats div:nth-child(3){border-left:0}.hxstats div:nth-child(n+3){border-top:1px solid var(--line)}}

.dayacts{display:flex;flex-wrap:wrap;gap:10px}
.tbtn.web{text-decoration:none}
@media (max-width:1480px){.tbtn.web .lbl,.tbtn[data-dl] .lbl{display:none}.tbtn.web,.tbtn[data-dl]{padding:7px 10px}}
.incub{margin:26px auto 4px;max-width:900px}
.incub .hxlogo{margin:0 auto 14px;width:72px;height:72px;border-radius:18px}
.incub p{margin:0 auto;color:var(--muted);font-size:14.5px;max-width:52ch}
.incrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.inct{height:72px;min-width:96px;padding:8px 18px;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid var(--line);border-radius:14px}
.inct img{width:auto;max-width:220px;object-fit:contain;display:block}
@media (max-width:620px){.inct{height:60px;padding:6px 12px}.inct img{transform:scale(.82)}}
.inct span{color:#0A0A0B;font-weight:600;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap}
.dayswitch{display:flex;gap:6px;margin:0 6px 16px}
.dsw{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 0;font-size:13.5px;font-weight:600}
.dsw:hover{color:var(--ink);border-color:var(--muted)}
.dsw.on{color:var(--ink);border-color:var(--dc);box-shadow:inset 0 -2px 0 var(--dc)}
.dl-wrap{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.dl-wrap.on{display:flex}
.dl-card{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:20px;overflow:hidden;color:var(--ink)}
.dl-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dl-head h2{font-size:22px}
.dl-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.dl-list{overflow:auto;padding:8px 14px}
.dl-day{border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;box-shadow:inset 3px 0 0 var(--dc)}
.dl-dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--surface)}
.dl-dh label,.dl-day li label{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0;flex:1}
.dl-dh small{display:block;color:var(--muted);font-size:12.5px}
.dl-dh b{font-size:16px}
.dl-day ul{list-style:none;margin:0;padding:4px 6px}
.dl-day li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.dl-day li:hover{background:var(--surface)}
.dl-code{flex:none;width:44px;color:var(--dc);font-weight:600;font-size:13px}
.dl-t{min-width:0;font-size:14.5px}
.dl-t small{display:block;color:var(--muted);font-size:12.5px}
.dl-day input[type=checkbox]{width:17px;height:17px;accent-color:var(--red2);flex:none}
.dl-day .pill{padding:6px 12px;font-size:13px;flex:none}
.dl-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 22px;border-top:1px solid var(--line)}
.dl-count{color:var(--muted);font-size:13.5px}
.dl-status{display:none;font-size:13.5px;color:var(--green2)}
.dl-status.show{display:inline}
.dl-status.bad{color:var(--red2)}
.dl-acts{margin-left:auto;display:flex;gap:8px}
.tbtn .ic{width:16px;height:16px}
@media (max-width:620px){.dl-day li .pill{display:none}.dl-dh{flex-wrap:wrap}}
</style>
</head>

      sessions: [
        { id: "d1-1", time: "9:30-10:00", min: 30, title: "Opening: 100 years of communication",

          visual: { type: "eras" },

          exercise: { title: "One task to hand over", steps: ["Write down the one task you most want to stop doing by hand", "Keep it on your desk card; we return to it on Day 3"] },

        { id: "d1-4", time: "11:00-11:45", min: 45, title: "Directing AI: the six-part instruction",
          lede: "Each part you add narrows what AI can give back, until only the answer you need is left.",
          visual: { type: "builder", items: [{ k: "Role", v: "You are a communications officer at NDDB." }, { k: "Context", v: "National Milk Day is on 26 November; we want to thank dairy farmers." }, { k: "Audience", v: "Dairy farmers and cooperative members in rural Gujarat." }, { k: "Task", v: "Write one Instagram post caption." }, { k: "Format", v: "Under 60 words, Hindi first then English, three hashtags." }, { k: "Constraints", v: "No invented figures or quotes; mark anything to check as [verify]." }] },
          pause: { q: "Quiz: Fix the Prompt. ‘Write a post for National Milk Day.’ What is missing?", options: ["Only the audience", "Only the format", "Almost everything except the task"], answer: 2, why: "It names a task and nothing else: no role, context, audience, format or limits. That is why the answer comes back generic." },

          notes: "Lead: Shreya demos (15); Bhawna floats during the build (45).\nUse published coverage only. Keep a ready-made tracker as a fallback if a group stalls." },
        { id: "d1-6", time: "13:45-14:30", min: 45, title: "Review checkpoint: the 5F drill",

        { id: "d2-5", time: "12:15-13:00", min: 45, title: "Agent lab: Agents 2, 3 and 4",

          lede: "Three note types, one format, every figure checked.",

          exercise: { title: "Draft and cross-review", steps: ["Each group drafts one note type for the running case", "Compare guided prompting with Group C’s Approval Note Drafter", "Another group reviews it against the 5F Check"],
            prompt: "Below are two redacted past NDDB approval notes for [note type]. Learn the format: headings, order, tone and level of detail. Then draft a new note for [event] using the facts I give you. Keep the same headings in the same order. Leave every amount, date and name I have not given as [to fill].\n\nPast notes: [paste]\nFacts: [paste]" },
          leave: "Three prompt templates, one per note type, in the playbook.",
          notes: "Lead: Bhawna. Use only redacted samples from the PR head." },
        { id: "d3-3", time: "11:00-12:00", min: 60, title: "Multilingual social media",
          lede: "Translation keeps the words. Transcreation keeps the meaning.",
          visual: { type: "backtrans" },
          exercise: { title: "Three-language caption set", steps: ["Translate the master captions", "Back-translate with the prompt below", "Get a native review, then mark ready to schedule"],
            prompt: "Translate this [Hindi / regional language] caption back into English word for word, then list any place where the meaning, tone or a name differs from the original English I give you.\n\nOriginal English: [paste]\nTranslated caption: [paste]" },
          leave: "A caption set in English, Hindi and one regional language, checked before scheduling.",
          notes: "Lead: Shreya. Each group has a native speaker for its regional language from the pre-survey." },
        { id: "d3-4", time: "12:00-12:45", min: 45, title: "Agent lab: Agent 5, Live Stakeholder Support",
          lede: "An agent that answers fast, from verified material only, and says when it does not know.",
          visual: { type: "agent", name: "Live Senior Stakeholder Support Agent", input: "The verified briefing and NotebookLM pack", steps: ["Read the official’s question", "Find the answer in the verified pack", "Reply in under 40 words with the source, or say it is not in the material"], check: "A PR officer reads the answer before it reaches the official", output: "A short, sourced answer" },
          pause: { q: "Quiz: Should the Agent Answer? ‘What is this district’s milk production this year?’ and it is not in the pack.", options: ["Answer with its best estimate", "Say it is not in the material", "Use last year’s figure"], answer: 1, why: "An unsourced figure in front of an official is worse than no answer." },
          exercise: { title: "Build and test Agent 5", steps: ["Build it on the verified pack", "Ask 10 rapid questions, including 3 it should decline", "Merge the best version"],
            prompt: "You support an NDDB official at a live event. Answer only from the documents provided. Keep answers under 40 words. Cite the document and page for every fact. If the answer is not in the documents, reply exactly: ‘Not in my material; please check with the PR team.’" },
          leave: "A support agent that declines what it cannot source.",
          notes: "Lead: Bhawna floats. Test the decline questions first." },
        { id: "d3-5", time: "13:45-14:45", min: 60, title: "Event-day simulation with all five agents",
          lede: "Updates every 5 minutes. Post each within 10, checked.",
          visual: { type: "newsroom" },
          pause: { q: "Quiz: Crisis Call. A false claim about milk quality is spreading. Your first public step?", options: ["A detailed rebuttal with figures", "A short holding statement that says you are checking", "Stay silent until everything is known"], answer: 1, why: "Acknowledge fast, commit to facts, and give figures only once verified." },
          exercise: { title: "Run the newsroom", steps: ["Assign roles: maker, checker, group lead", "Post each update within 10 minutes after a quick 5F check", "Draft the holding statement when the inject arrives"] },
          leave: "Live posts, briefings, a holding statement and your Race 2 time.",
          notes: "Lead: Shreya runs the clock and injects; Bhawna plays the official. Include one low-connectivity round." },
        { id: "d3-6", time: "14:45-15:30", min: 45, title: "Remake Round 2: what changed",
          lede: "The same three items, the same 30 minutes.",
          visual: { type: "scores", which: "d3" },
          pause: { q: "Quiz: Spot the Made-up Number. The tracker’s report says reach was 2.4 lakh, but the metrics sheet shows no reach figure. What is it?", options: ["A reasonable estimate", "An invented number", "A rounding difference"], answer: 1, why: "If it is not in the data, AI made it up. Remove it or source it." },
          exercise: { title: "Remake and compare", steps: ["Remake the same three items", "Place Day 1 and Day 3 versions side by side", "Score both on the same rubric"] },
          leave: "Your own before and after.",
          notes: "Lead: Bhawna times and scores." },
        { id: "d3-7", time: "15:45-16:30", min: 45, title: "Showcase",
          lede: "The PR head decides what NDDB actually uses.",
          visual: { type: "flow", steps: [{ label: "Present", detail: "Each group shows its kit and agent" }, { label: "Blind test", detail: "The PR head repeats it" }, { label: "Select", detail: "Items and agents for real use" }, { label: "Finale", detail: "Leaderboard and champion" }] },
          leave: "Items and agents chosen for NDDB’s real event.",
          notes: "Lead: Shreya. Run the Grand Finale quiz (15 questions) before revealing the leaderboard." },
        { id: "d3-8", time: "16:30-16:50", min: 20, title: "Agency-task audit",
          lede: "What do you still send outside that you can now do in-house?",
          visual: { type: "grid", items: [{ k: "Design", v: "Festival posts, templates, backdrops" }, { k: "Editing", v: "Reels, revisions, voice-over" }, { k: "Drafting", v: "Notes, captions, briefs" }] },
          exercise: { title: "Make the shortlist", steps: ["List tasks currently sent to agencies", "Mark which you can now do in-house", "Agree the top three to bring in"],
            prompt: "Here is a list of tasks our team sends to external agencies: [paste]. For each, say whether the workflows we practised (templates, image tools, video assembly, voice-over, translation, approval-note drafting) could bring it in-house, what would still need a specialist, and what review step it needs." },
          leave: "A shortlist of tasks to bring in-house.",
          notes: "Lead: Bhawna." },
        { id: "d3-9", time: "16:50-17:30", min: 40, title: "Close: the seventh marker",
          lede: "The timeline returns, with a new chapter: the NDDB PR team, November 2026.",
          visual: { type: "eras", seventh: true },
          exercise: { title: "Handover", steps: ["Walk through the playbook, including each agent’s set-up", "Complete the post-survey", "Join the 30-day challenge: one real task a week with AI"] },
          leave: "The playbook, a certificate, and a date for the review session in about 3 weeks.",
          notes: "Lead: Shreya. Read the closing beat. Bhawna hands out certificates and confirms the review-session date." }
      ]
    }

    var tk = max === 5 ? 5 : 4; for (var t = 0; t <= tk; t++) { var v = max * t / tk, yy = y(v); g += '<line x1="' + L + '" x2="' + (W - 6) + '" y1="' + yy + '" y2="' + yy + '" class="gl"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" class="ax" text-anchor="end">' + (Math.round(v * 10) / 10) + '</text>'; }

      var x0 = L + i * cw + (cw - n * bw - (n - 1) * 6) / 2;

      });
      g += '<text class="ax" x="' + (L + i * cw + cw / 2) + '" y="' + (H - 12) + '" text-anchor="middle">' + esc(c) + '</text>';
    });

  function viewTeam(){

  }
  function viewReferences(){

    h += '<div class="chips">' + groups.map(function(g){ return '<button class="chip' + (ui.refGrp === g ? " on" : "") + '" data-act="refgrp" data-v="' + esc(g) + '">' + (g === "all" ? "All tools" : esc(g)) + '</button>'; }).join("") + '</div>';
    D.refs.forEach(function(g){

        return '<div class="refc"><div class="refhead"><h3>' + esc(t.n) + '</h3><span class="refwhen">' + esc(t.when) + '</span></div><p>' + esc(t.w) + '</p>' +
          (t.steps ? '<ol class="refsteps">' + t.steps.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + '</ol>' : "") +
          '<div class="refurl">' + esc(t.ul) + '</div><div class="plinks"><a class="pill solid reflink" href="' + esc(t.u) + '" target="_blank" rel="noopener">' + IC_LINK + 'Open ' + esc(t.s || t.n) + '</a>' + (t.x ? '<a class="pill" href="' + esc(t.x) + '" target="_blank" rel="noopener">' + esc(t.xl) + '</a>' : "") + '</div></div>';

  }

  function render(scrollTop){
    renderTabs(); renderSide();
    var v = ui.view, s = findSession(v), html, sy = window.scrollY;
    if (s) html = viewSession(s);
    else if (v === "agents") html = viewAgents();

    else if (v === "references") html = viewReferences();
    else if (v === "team") html = viewTeam();

  }
  function go(id){
    stopPlay();
    if (id === ui.view) { $("side").classList.remove("open"); return; }

  /* ---------- Present mode ---------- */
  var deck = [];
  function buildDeck(){
    deck = []; var d = currentDay();

      deck.push({ kind: "html", where: "The story", html: '<div class="titleslide"><div class="k">' + esc(D.when) + '</div><h1 class="stitle">' + esc(D.title) + '</h1><p class="slede">Every technology changed how fast a message travels. AI is the first to change who can make it.</p></div>', notes: "Open with the two-minute story of 1906." });

    d.sessions.forEach(function(s){

  function slideHtml(it){
    if (it.kind === "html") return it.html;

    var s = it.s;
    if (it.kind === "s-title") return '<div class="titleslide"><div class="k">' + esc(code(s)) + ', ' + esc(s.time) + ', ' + s.min + ' min</div><h1 class="stitle">' + esc(s.title) + '</h1><p class="slede">' + esc(s.lede) + '</p></div>';

  }
  function closeStage(){
    stopPlay(); $("stage").hidden = true; document.body.style.overflow = "";
